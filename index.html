<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alicean — Мессенджер</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        }

        body {
            background: radial-gradient(circle at 20% 30%, #1a0b2e, #0a0515);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Анимация радужной рамки */
        @keyframes rainbowBorder {
            0% { border-color: #ff0a54; box-shadow: 0 0 5px #ff0a54; }
            50% { border-color: #6a4eff; box-shadow: 0 0 20px #6a4eff; }
            100% { border-color: #ff0a54; box-shadow: 0 0 5px #ff0a54; }
        }

        /* Экран входа/регистрации */
        .auth-box {
            max-width: 450px;
            width: 100%;
            background: rgba(30, 20, 50, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 35px;
            border: 2px solid #ff77aa;
            animation: rainbowBorder 2s infinite;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 36px;
            background: linear-gradient(90deg, #ff0a54, #ff9f4a, #ffd166, #6a4eff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .sub {
            text-align: center;
            color: #b0a0d0;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            background: #2a1a3e;
            border: 1px solid #8a6ab0;
            border-radius: 30px;
            color: white;
            font-size: 16px;
            outline: none;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #ff6a8a, #c55cff);
            border: none;
            border-radius: 30px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            font-size: 16px;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid #ff77aa;
        }

        .msg {
            text-align: center;
            margin-top: 15px;
            padding: 8px;
            border-radius: 15px;
            font-size: 13px;
        }
        .error { background: #ff4444; color: white; }
        .success { background: #44aa44; color: white; }
        .hidden { display: none; }

        /* Чат */
        .chat-layout {
            display: flex;
            width: 1200px;
            max-width: 100%;
            height: 85vh;
            background: rgba(30, 20, 50, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            overflow: hidden;
            border: 2px solid #ff77aa;
            animation: rainbowBorder 2s infinite;
        }

        .sidebar {
            width: 280px;
            background: rgba(20, 10, 35, 0.9);
            padding: 15px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #ff77aa;
        }

        .profile {
            text-align: center;
            color: white;
            padding-bottom: 15px;
            border-bottom: 1px solid #ff77aa;
            margin-bottom: 15px;
            cursor: pointer;
        }
        .profile-avatar {
            width: 60px;
            height: 60px;
            background: linear-gradient(145deg, #ffb347, #ff6b9d);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin: 0 auto 8px auto;
            overflow: hidden;
        }
        .profile-name { font-weight: bold; margin-top: 5px; }
        .profile-phone { font-size: 11px; color: #b0a0d0; }

        .search-box {
            width: 100%;
            padding: 10px;
            background: #2a1a3e;
            border: 1px solid #ff77aa;
            border-radius: 25px;
            color: white;
            margin-bottom: 10px;
        }
        .search-results {
            max-height: 150px;
            overflow-y: auto;
            background: #1a0b2e;
            border-radius: 15px;
            margin-bottom: 10px;
            display: none;
        }
        .search-item {
            padding: 8px 12px;
            border-bottom: 1px solid #ff77aa;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }
        .search-item:hover { background: #ff77aa30; }

        .chats-list {
            flex: 1;
            overflow-y: auto;
        }
        .chat-item {
            background: #2a1a3e;
            padding: 10px;
            border-radius: 15px;
            margin-bottom: 8px;
            cursor: pointer;
        }
        .chat-item.active {
            background: linear-gradient(90deg, #ff6a8a, #c55cff);
        }

        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .chat-header {
            padding: 15px;
            background: #1f103f;
            color: white;
            font-weight: bold;
            border-bottom: 1px solid #ff77aa;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }
        .my-message { text-align: right; margin: 8px 0; }
        .my-message .bubble { background: #ff6a8a; display: inline-block; padding: 8px 15px; border-radius: 18px; max-width: 70%; }
        .other-message { text-align: left; margin: 8px 0; }
        .other-message .bubble { background: #3a2a5a; display: inline-block; padding: 8px 15px; border-radius: 18px; max-width: 70%; }
        .time { font-size: 10px; opacity: 0.6; margin-top: 3px; }

        .input-area {
            padding: 15px;
            display: flex;
            gap: 10px;
            border-top: 1px solid #ff77aa;
            background: #1f103f;
        }
        .input-area input { flex: 1; margin: 0; }
        .input-area button { width: auto; margin: 0; padding: 12px 20px; }

        .btn-red { background: #e63946; margin-top: 15px; }
        .small-buttons { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
        .small-buttons button { flex: 1; margin: 0; padding: 6px; font-size: 11px; }

        /* Модальное окно настроек */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #2a1a3e;
            border-radius: 30px;
            padding: 25px;
            width: 380px;
            text-align: center;
            border: 2px solid #ff77aa;
        }
        .avatar-preview {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(145deg, #ffb347, #ff6b9d);
            margin: 10px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            overflow: hidden;
        }
        .avatar-emoji {
            font-size: 40px;
            cursor: pointer;
            padding: 5px;
            display: inline-block;
        }
        .close-modal { background: #e63946; margin-top: 15px; }
    </style>
</head>
<body>

<!-- ЭКРАН ВХОДА/РЕГИСТРАЦИИ -->
<div id="authScreen" class="auth-box">
    <h1>🌈 Alicean</h1>
    <p class="sub">🔒 Безопасный мессенджер</p>
    
    <div id="loginDiv">
        <input type="text" id="loginId" placeholder="Телефон или Email">
        <input type="password" id="loginPass" placeholder="Пароль">
        <div id="loginMsg" class="msg hidden"></div>
        <button id="loginBtn">Войти</button>
        <button id="showRegBtn" class="btn-outline">Создать аккаунт</button>
    </div>

    <div id="regDiv" class="hidden">
        <input type="text" id="regName" placeholder="Имя">
        <input type="tel" id="regPhone" placeholder="Телефон">
        <input type="email" id="regEmail" placeholder="Email">
        <input type="password" id="regPass" placeholder="Пароль">
        <div id="regMsg" class="msg hidden"></div>
        <button id="regBtn">Зарегистрироваться</button>
        <button id="showLoginBtn" class="btn-outline">Уже есть аккаунт?</button>
    </div>
</div>

<!-- ЭКРАН ЧАТА -->
<div id="chatScreen" class="hidden">
    <div class="chat-layout">
        <div class="sidebar">
            <div class="profile" id="profileBtn">
                <div class="profile-avatar" id="profileAvatar">🌈</div>
                <div class="profile-name" id="userName"></div>
                <div class="profile-phone" id="userPhone"></div>
            </div>
            <input type="text" id="searchInput" class="search-box" placeholder="🔍 Найти пользователя...">
            <div id="searchResults" class="search-results"></div>
            <div class="chats-list" id="chatsList"></div>
            <div class="small-buttons">
                <button id="createChannelBtn">📢 Канал</button>
                <button id="callBtn">📞 Звонок</button>
                <button id="giftBtn">🎁 Подарок</button>
            </div>
            <button id="logoutBtn" class="btn-red">🚪 Выйти</button>
        </div>
        <div class="main-chat">
            <div class="chat-header" id="chatHeader">Выберите чат</div>
            <div class="messages" id="messagesList"></div>
            <div class="input-area">
                <input type="text" id="msgInput" placeholder="Сообщение...">
                <button id="sendBtn">Отправить</button>
            </div>
        </div>
    </div>
</div>

<script>
    let currentUser = null;
    let allChats = [];
    let activeChat = null;
    let allUsers = [];

    function save() {
        if(currentUser) {
            localStorage.setItem('am_' + currentUser.id, JSON.stringify({ user: currentUser, chats: allChats }));
        }
    }

    function loadUsers() {
        allUsers = [];
        for(let i = 0; i < localStorage.length; i++) {
            let key = localStorage.key(i);
            if(key && key.startsWith('am_') && (!currentUser || key !== 'am_' + currentUser.id)) {
                try {
                    let data = JSON.parse(localStorage.getItem(key));
                    if(data.user) allUsers.push(data.user);
                } catch(e) {}
            }
        }
    }

    function register(name, phone, email, pass) {
        if(!name || !phone || !email || !pass) return 'Заполните все поля!';
        for(let i = 0; i < localStorage.length; i++) {
            let key = localStorage.key(i);
            if(key && key.startsWith('am_')) {
                let data = JSON.parse(localStorage.getItem(key));
                if(data.user.phone === phone) return 'Телефон занят!';
                if(data.user.email === email) return 'Email занят!';
            }
        }
        let id = Date.now() + '_' + Math.random();
        currentUser = { id: id, name: name, phone: phone, email: email, password: pass, avatar: '🌈' };
        allChats = [{ id: 'main', name: '🌈 Общий чат', messages: [{ text: 'Добро пожаловать, ' + name + '!', sender: 'system', time: new Date().toLocaleTimeString() }] }];
        save();
        return 'ok';
    }

    function login(id, pass) {
        for(let i = 0; i < localStorage.length; i++) {
            let key = localStorage.key(i);
            if(key && key.startsWith('am_')) {
                let data = JSON.parse(localStorage.getItem(key));
                let u = data.user;
                if((u.phone === id || u.email === id || u.name === id) && u.password === pass) {
                    currentUser = u;
                    allChats = data.chats || [];
                    if(!currentUser.avatar) currentUser.avatar = '🌈';
                    save();
                    return true;
                }
            }
        }
        return false;
    }

    function searchUsers(q) {
        if(!q.trim()) return [];
        q = q.toLowerCase();
        return allUsers.filter(u => u.name.toLowerCase().includes(q) || u.phone.includes(q) || u.email.toLowerCase().includes(q));
    }

    function createPrivateChat(other) {
        let existing = allChats.find(c => c.type === 'private' && c.participants && c.participants.includes(currentUser.id) && c.participants.includes(other.id));
        if(existing) {
            activeChat = existing.id;
            document.getElementById('chatHeader').innerHTML = existing.name;
            renderMessages(existing);
            renderChats();
            return;
        }
        let newChat = {
            id: 'priv_' + Date.now(),
            name: other.name,
            type: 'private',
            participants: [currentUser.id, other.id],
            messages: [{ text: '🔒 Чат с ' + other.name + ' защищён!', sender: 'system', time: new Date().toLocaleTimeString() }]
        };
        allChats.push(newChat);
        save();
        renderChats();
        activeChat = newChat.id;
        document.getElementById('chatHeader').innerHTML = newChat.name;
        renderMessages(newChat);
    }

    function addMessage(chatId, text) {
        let chat = allChats.find(c => c.id === chatId);
        if(chat) {
            chat.messages.push({ text: text, sender: currentUser.name, time: new Date().toLocaleTimeString() });
            save();
            if(activeChat === chatId) renderMessages(chat);
            renderChats();
        }
    }

    function renderMessages(chat) {
        let container = document.getElementById('messagesList');
        if(!chat.messages || !chat.messages.length) {
            container.innerHTML = '<div style="color:#aaa; text-align:center;">Нет сообщений</div>';
            return;
        }
        container.innerHTML = '';
        for(let i = 0; i < chat.messages.length; i++) {
            let msg = chat.messages[i];
            let isMy = msg.sender === currentUser.name;
            let div = document.createElement('div');
            div.className = isMy ? 'my-message' : 'other-message';
            div.innerHTML = '<div class="bubble"><b>' + (msg.sender !== 'system' ? msg.sender : '📢') + '</b><br>' + msg.text + '<div class="time">' + msg.time + '</div></div>';
            container.appendChild(div);
        }
        container.scrollTop = container.scrollHeight;
    }

    function renderChats() {
        let container = document.getElementById('chatsList');
        if(!allChats.length) {
            container.innerHTML = '<div style="color:#aaa; text-align:center; padding:15px;">Нет чатов<br>Найдите друзей через поиск</div>';
            return;
        }
        container.innerHTML = '';
        for(let i = 0; i < allChats.length; i++) {
            let chat = allChats[i];
            let div = document.createElement('div');
            div.className = 'chat-item';
            if(activeChat === chat.id) div.classList.add('active');
            div.innerHTML = '<b>' + chat.name + '</b><br><span style="font-size:10px;">🔒 Защищён</span>';
            div.onclick = (function(c) { return function() {
                activeChat = c.id;
                document.getElementById('chatHeader').innerHTML = c.name;
                renderMessages(c);
                renderChats();
            }; })(chat);
            container.appendChild(div);
        }
    }

    function createChannel() {
        let name = prompt('Название канала:');
        if(name && name.trim()) {
            allChats.push({ id: 'ch_' + Date.now(), name: name, type: 'channel', messages: [{ text: '✨ Канал "' + name + '" создан!', sender: 'system', time: new Date().toLocaleTimeString() }] });
            save();
            renderChats();
        }
    }

    // НАСТРОЙКИ И АВАТАР
    function showSettings() {
        let modal = document.createElement('div');
        modal.className = 'modal';
        let emojis = ['🌈', '🌟', '🦄', '🎨', '💖', '✨', '🌸', '🐱', '⭐', '👑', '😎', '🤖'];
        let emojiHtml = '';
        for(let i = 0; i < emojis.length; i++) {
            emojiHtml += '<span class="avatar-emoji" data-avatar="' + emojis[i] + '">' + emojis[i] + '</span>';
        }
        modal.innerHTML = `
            <div class="modal-content">
                <h3>⚙️ Настройки профиля</h3>
                <div class="avatar-preview" id="settingsAvatar">${currentUser.avatar || '🌈'}</div>
                <div>${emojiHtml}</div>
                <input type="text" id="settingsName" value="${currentUser.name}" placeholder="Имя" style="margin-top:15px;">
                <input type="tel" id="settingsPhone" value="${currentUser.phone}" placeholder="Телефон">
                <input type="email" id="settingsEmail" value="${currentUser.email}" placeholder="Email">
                <div id="settingsMsg" class="msg hidden"></div>
                <button id="saveSettings">💾 Сохранить</button>
                <button id="closeSettings" class="close-modal">Закрыть</button>
            </div>
        `;
        document.body.appendChild(modal);
        
        document.querySelectorAll('.avatar-emoji').forEach(opt => {
            opt.onclick = function() {
                currentUser.avatar = this.getAttribute('data-avatar');
                document.getElementById('settingsAvatar').innerHTML = currentUser.avatar;
                document.getElementById('profileAvatar').innerHTML = currentUser.avatar;
                save();
                document.getElementById('settingsMsg').className = 'msg success';
                document.getElementById('settingsMsg').innerText = 'Аватар изменён!';
            };
        });
        
        document.getElementById('saveSettings').onclick = () => {
            let newName = document.getElementById('settingsName').value.trim();
            let newPhone = document.getElementById('settingsPhone').value.trim();
            let newEmail = document.getElementById('settingsEmail').value.trim();
            if(newName) currentUser.name = newName;
            if(newPhone) currentUser.phone = newPhone;
            if(newEmail) currentUser.email = newEmail;
            save();
            document.getElementById('userName').innerHTML = currentUser.name;
            document.getElementById('userPhone').innerHTML = '📞 ' + currentUser.phone;
            document.getElementById('settingsMsg').className = 'msg success';
            document.getElementById('settingsMsg').innerText = '✅ Сохранено!';
            setTimeout(() => modal.remove(), 1000);
        };
        document.getElementById('closeSettings').onclick = () => modal.remove();
    }

    function showChat() {
        document.getElementById('authScreen').classList.add('hidden');
        document.getElementById('chatScreen').classList.remove('hidden');
        document.getElementById('userName').innerHTML = currentUser.name;
        document.getElementById('userPhone').innerHTML = '📞 ' + currentUser.phone;
        document.getElementById('profileAvatar').innerHTML = currentUser.avatar || '🌈';
        loadUsers();
        renderChats();
        
        // Поиск
        let searchInput = document.getElementById('searchInput');
        let resultsDiv = document.getElementById('searchResults');
        searchInput.oninput = function() {
            let results = searchUsers(this.value);
            if(results.length && this.value.trim()) {
                resultsDiv.style.display = 'block';
                resultsDiv.innerHTML = '';
                for(let i = 0; i < results.length; i++) {
                    let u = results[i];
                    let div = document.createElement('div');
                    div.className = 'search-item';
                    div.innerHTML = '<span>' + (u.avatar || '👤') + ' ' + u.name + '<br><span style="font-size:10px;">📞 ' + u.phone + '</span></span><button style="width:auto; padding:5px 12px;">💬</button>';
                    div.onclick = () => createPrivateChat(u);
                    resultsDiv.appendChild(div);
                }
            } else {
                resultsDiv.style.display = 'none';
            }
        };
        
        if(allChats.length) {
            activeChat = allChats[0].id;
            document.getElementById('chatHeader').innerHTML = allChats[0].name;
            renderMessages(allChats[0]);
        }
    }

    // Обработчики кнопок
    document.getElementById('loginBtn').onclick = function() {
        let id = document.getElementById('loginId').value.trim();
        let pass = document.getElementById('loginPass').value.trim();
        let msg = document.getElementById('loginMsg');
        if(!id || !pass) { msg.classList.remove('hidden'); msg.className = 'msg error'; msg.innerText = 'Заполните поля!'; return; }
        if(login(id, pass)) { showChat(); }
        else { msg.classList.remove('hidden'); msg.className = 'msg error'; msg.innerText = 'Неверные данные!'; }
    };

    document.getElementById('regBtn').onclick = function() {
        let name = document.getElementById('regName').value.trim();
        let phone = document.getElementById('regPhone').value.trim();
        let email = document.getElementById('regEmail').value.trim();
        let pass = document.getElementById('regPass').value.trim();
        let msg = document.getElementById('regMsg');
        let res = register(name, phone, email, pass);
        if(res === 'ok') {
            msg.classList.remove('hidden'); msg.className = 'msg success'; msg.innerText = '✅ Аккаунт создан!';
            setTimeout(() => showChat(), 1500);
        } else {
            msg.classList.remove('hidden'); msg.className = 'msg error'; msg.innerText = res;
        }
    };

    document.getElementById('showRegBtn').onclick = function() {
        document.getElementById('loginDiv').classList.add('hidden');
        document.getElementById('regDiv').classList.remove('hidden');
    };

    document.getElementById('showLoginBtn').onclick = function() {
        document.getElementById('regDiv').classList.add('hidden');
        document.getElementById('loginDiv').classList.remove('hidden');
    };

    document.getElementById('sendBtn').onclick = function() {
        let input = document.getElementById('msgInput');
        if(activeChat && input.value.trim()) {
            addMessage(activeChat, input.value.trim());
            input.value = '';
        }
    };

    document.getElementById('msgInput').addEventListener('keypress', function(e) {
        if(e.key === 'Enter') document.getElementById('sendBtn').click();
    });

    document.getElementById('createChannelBtn').onclick = createChannel;
    document.getElementById('callBtn').onclick = function() { if(activeChat) { alert('📞 Защищённый звонок!'); addMessage(activeChat, '🔊 Аудиозвонок'); } else alert('Выберите чат'); };
    document.getElementById('giftBtn').onclick = function() { if(activeChat) { let gifts = ['🌹 Роза', '🎂 Торт', '💖 Сердце', '⭐ Звезда', '👑 Корона']; let c = prompt('Подарок:\n1-🌹 2-🎂 3-💖 4-⭐ 5-👑'); if(c>=1 && c<=5) addMessage(activeChat, '🎁 Подарок: ' + gifts[c-1] + ' от ' + currentUser.name); } else alert('Выберите чат'); };
    
    document.getElementById('profileBtn').onclick = showSettings;
    
    document.getElementById('logoutBtn').onclick = function() {
        currentUser = null;
        document.getElementById('chatScreen').classList.add('hidden');
        document.getElementById('authScreen').classList.remove('hidden');
        document.getElementById('loginDiv').classList.remove('hidden');
        document.getElementById('regDiv').classList.add('hidden');
        document.getElementById('loginId').value = '';
        document.getElementById('loginPass').value = '';
    };
</script>
</body>
</html>
