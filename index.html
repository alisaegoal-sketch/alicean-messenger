<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Alicean</title>
    <style>
        body {
            background: linear-gradient(135deg, #1a0b2e, #0a0515);
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .box {
            background: #2a1a3e;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            border: 2px solid #ff77aa;
        }
        h1 { color: white; margin-bottom: 10px; }
        p { color: #b0a0d0; margin-bottom: 20px; }
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background: #1a0b2e;
            border: 1px solid #ff77aa;
            border-radius: 25px;
            color: white;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #ff6a8a;
            border: none;
            border-radius: 25px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn2 { background: transparent; border: 1px solid #ff77aa; }
        .hidden { display: none; }
        .msg { margin-top: 15px; padding: 8px; border-radius: 10px; font-size: 13px; }
        .error { background: #ff4444; color: white; }
        .success { background: #44aa44; color: white; }
    </style>
</head>
<body>

<div id="authBox" class="box">
    <h1>🌈 Alicean</h1>
    <p>🔒 Безопасный мессенджер</p>
    
    <div id="loginDiv">
        <input type="text" id="loginId" placeholder="Телефон или Email">
        <input type="password" id="loginPass" placeholder="Пароль">
        <div id="loginMsg" class="msg hidden"></div>
        <button id="loginBtn">Войти</button>
        <button id="toRegBtn" class="btn2">Создать аккаунт</button>
    </div>

    <div id="regDiv" class="hidden">
        <input type="text" id="regName" placeholder="Имя">
        <input type="tel" id="regPhone" placeholder="Телефон">
        <input type="email" id="regEmail" placeholder="Email">
        <input type="password" id="regPass" placeholder="Пароль">
        <div id="regMsg" class="msg hidden"></div>
        <button id="regBtn">Зарегистрироваться</button>
        <button id="toLoginBtn" class="btn2">Уже есть аккаунт?</button>
    </div>
</div>

<div id="chatBox" class="box hidden">
    <h1>💬 Alicean</h1>
    <p id="userName"></p>
    <div id="messages" style="height: 200px; overflow-y: auto; background: #1a0b2e; border-radius: 15px; padding: 10px; margin: 15px 0; text-align: left;"></div>
    <input type="text" id="msgInput" placeholder="Сообщение...">
    <button id="sendBtn">Отправить</button>
    <button id="logoutBtn" class="btn2" style="margin-top: 10px;">Выйти</button>
</div>

<script>
    let currentUser = null;
    let chats = [];
    let activeChat = null;

    function save() {
        if(currentUser) {
            let data = { user: currentUser, chats: chats };
            localStorage.setItem('am_' + currentUser.id, JSON.stringify(data));
        }
    }

    function register(name, phone, email, pass) {
        if(!name || !phone || !email || !pass) return 'Заполните все поля!';
        for(let i = 0; i < localStorage.length; i++) {
            let key = localStorage.key(i);
            if(key && key.startsWith('am_')) {
                let data = JSON.parse(localStorage.getItem(key));
                if(data.user.phone === phone) return 'Телефон занят!';
                if(data.user.email === email) return 'Email занят!';
            }
        }
        let id = Date.now() + '_' + Math.random();
        currentUser = { id: id, name: name, phone: phone, email: email, password: pass };
        chats = [{ id: 'main', name: 'Общий чат', messages: [{ text: 'Добро пожаловать, ' + name + '!', sender: 'system', time: new Date().toLocaleTimeString() }] }];
        save();
        return 'ok';
    }

    function login(id, pass) {
        for(let i = 0; i < localStorage.length; i++) {
            let key = localStorage.key(i);
            if(key && key.startsWith('am_')) {
                let data = JSON.parse(localStorage.getItem(key));
                let u = data.user;
                if((u.phone === id || u.email === id || u.name === id) && u.password === pass) {
                    currentUser = u;
                    chats = data.chats;
                    save();
                    return true;
                }
            }
        }
        return false;
    }

    function addMessage(text) {
        if(activeChat) {
            let chat = chats.find(c => c.id === activeChat);
            if(chat) {
                chat.messages.push({ text: text, sender: currentUser.name, time: new Date().toLocaleTimeString() });
                save();
                showMessages();
            }
        }
    }

    function showMessages() {
        let container = document.getElementById('messages');
        let chat = chats.find(c => c.id === activeChat);
        if(!chat || !chat.messages || chat.messages.length === 0) {
            container.innerHTML = 'Нет сообщений';
            return;
        }
        container.innerHTML = '';
        for(let i = 0; i < chat.messages.length; i++) {
            let msg = chat.messages[i];
            let isMine = (msg.sender === currentUser.name);
            container.innerHTML += '<div style="text-align: ' + (isMine ? 'right' : 'left') + '; margin: 5px 0;"><div style="background: ' + (isMine ? '#ff6a8a' : '#3a2a5a') + '; padding: 8px 12px; border-radius: 15px; display: inline-block; max-width: 80%;"><b>' + (msg.sender !== 'system' ? msg.sender : '📢') + '</b><br>' + msg.text + '<br><span style="font-size: 10px;">' + msg.time + '</span></div></div>';
        }
        container.scrollTop = container.scrollHeight;
    }

    function showChat() {
        document.getElementById('authBox').classList.add('hidden');
        document.getElementById('chatBox').classList.remove('hidden');
        document.getElementById('userName').innerHTML = '👤 ' + currentUser.name + '<br><span style="font-size: 12px;">📞 ' + currentUser.phone + '</span>';
        if(chats.length) {
            activeChat = chats[0].id;
            showMessages();
        }
    }

    document.getElementById('loginBtn').onclick = function() {
        let id = document.getElementById('loginId').value.trim();
        let pass = document.getElementById('loginPass').value.trim();
        let msgDiv = document.getElementById('loginMsg');
        if(!id || !pass) {
            msgDiv.classList.remove('hidden');
            msgDiv.className = 'msg error';
            msgDiv.innerText = 'Заполните поля!';
            return;
        }
        if(login(id, pass)) {
            showChat();
        } else {
            msgDiv.classList.remove('hidden');
            msgDiv.className = 'msg error';
            msgDiv.innerText = 'Неверные данные!';
        }
    };

    document.getElementById('regBtn').onclick = function() {
        let name = document.getElementById('regName').value.trim();
        let phone = document.getElementById('regPhone').value.trim();
        let email = document.getElementById('regEmail').value.trim();
        let pass = document.getElementById('regPass').value.trim();
        let msgDiv = document.getElementById('regMsg');
        let res = register(name, phone, email, pass);
        if(res === 'ok') {
            msgDiv.classList.remove('hidden');
            msgDiv.className = 'msg success';
            msgDiv.innerText = '✅ Аккаунт создан!';
            setTimeout(() => { showChat(); }, 1500);
        } else {
            msgDiv.classList.remove('hidden');
            msgDiv.className = 'msg error';
            msgDiv.innerText = res;
        }
    };

    document.getElementById('sendBtn').onclick = function() {
        let input = document.getElementById('msgInput');
        if(input.value.trim()) {
            addMessage(input.value.trim());
            input.value = '';
        }
    };

    document.getElementById('msgInput').addEventListener('keypress', function(e) {
        if(e.key === 'Enter') document.getElementById('sendBtn').click();
    });

    document.getElementById('toRegBtn').onclick = function() {
        document.getElementById('loginDiv').classList.add('hidden');
        document.getElementById('regDiv').classList.remove('hidden');
    };

    document.getElementById('toLoginBtn').onclick = function() {
        document.getElementById('regDiv').classList.add('hidden');
        document.getElementById('loginDiv').classList.remove('hidden');
    };

    document.getElementById('logoutBtn').onclick = function() {
        currentUser = null;
        document.getElementById('chatBox').classList.add('hidden');
        document.getElementById('authBox').classList.remove('hidden');
        document.getElementById('loginDiv').classList.remove('hidden');
        document.getElementById('regDiv').classList.add('hidden');
        document.getElementById('loginId').value = '';
        document.getElementById('loginPass').value = '';
    };
</script>
</body>
</html>
