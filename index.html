<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alicean — Поиск друзей и личные чаты</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', sans-serif;
        }
        body {
            background: radial-gradient(circle at 20% 30%, #1a0b2e, #0a0515);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        @keyframes borderPulse {
            0% { border-color: #ff0a54; box-shadow: 0 0 5px #ff0a54; }
            50% { border-color: #6a4eff; box-shadow: 0 0 20px #6a4eff; }
            100% { border-color: #ff0a54; box-shadow: 0 0 5px #ff0a54; }
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: rgba(30, 20, 50, 0.95);
            border-radius: 32px;
            padding: 35px;
            border: 2px solid #ff77aa;
            animation: borderPulse 2s infinite;
        }
        h1 {
            text-align: center;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #ff0a54, #ff9f4a, #ffd166, #6a4eff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .sub {
            text-align: center;
            color: #b0a0d0;
            margin-bottom: 25px;
        }
        input {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            background: #2a1a3e;
            border: 1px solid #8a6ab0;
            border-radius: 30px;
            color: white;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #ff6a8a, #c55cff);
            border: none;
            border-radius: 30px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }
        .btn-outline { background: transparent; border: 1px solid #ff77aa; }
        .msg { text-align: center; margin-top: 15px; padding: 8px; border-radius: 15px; font-size: 13px; }
        .error { background: #ff4444; color: white; }
        .success { background: #44aa44; color: white; }
        .hidden { display: none; }
        
        .profile-avatar {
            width: 80px;
            height: 80px;
            background: linear-gradient(145deg, #ffb347, #ff6b9d);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin: 0 auto 15px auto;
            cursor: pointer;
            overflow: hidden;
        }
        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .search-section {
            margin: 15px 0;
        }
        .search-input {
            width: 100%;
            padding: 12px;
            background: #2a1a3e;
            border: 1px solid #ff77aa;
            border-radius: 30px;
            color: white;
            font-size: 14px;
        }
        .search-results {
            max-height: 200px;
            overflow-y: auto;
            margin-top: 10px;
            background: #1a0b2e;
            border-radius: 20px;
            display: none;
        }
        .search-item {
            padding: 12px;
            border-bottom: 1px solid #ff77aa;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }
        .search-item:hover {
            background: #ff77aa30;
        }
        .search-item button {
            width: auto;
            padding: 6px 15px;
            margin: 0;
            font-size: 12px;
        }
        
        .chat-item {
            background: #2a1a3e;
            padding: 12px;
            border-radius: 20px;
            margin-bottom: 8px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-item.active {
            background: linear-gradient(90deg, #ff6a8a, #c55cff);
        }
        
        .messages-area {
            background: #1a0b2e;
            border-radius: 20px;
            padding: 15px;
            height: 300px;
            overflow-y: auto;
            margin: 20px 0;
        }
        
        .my-message {
            text-align: right;
            margin: 8px 0;
        }
        .my-message .bubble {
            background: #ff6a8a;
            display: inline-block;
            padding: 8px 15px;
            border-radius: 18px;
            max-width: 80%;
        }
        .other-message {
            text-align: left;
            margin: 8px 0;
        }
        .other-message .bubble {
            background: #3a2a5a;
            display: inline-block;
            padding: 8px 15px;
            border-radius: 18px;
            max-width: 80%;
        }
        .time {
            font-size: 10px;
            opacity: 0.7;
            margin-top: 3px;
        }
        
        .flex-row {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .flex-row button {
            flex: 1;
            margin: 0;
            padding: 10px;
            font-size: 12px;
        }
        
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #2a1a3e;
            border-radius: 30px;
            padding: 30px;
            text-align: center;
            border: 2px solid #ff77aa;
            width: 350px;
        }
        .avatar-emoji {
            font-size: 40px;
            cursor: pointer;
            padding: 8px;
            display: inline-block;
        }
        .close-btn { background: #e63946; margin-top: 15px; }
    </style>
</head>
<body>

<div id="authScreen" class="container">
    <h1>🌈 Alicean</h1>
    <p class="sub">🔒 Безопасный мессенджер</p>
    
    <div id="loginBlock">
        <input type="text" id="loginId" placeholder="Телефон или Email">
        <input type="password" id="loginPass" placeholder="Пароль">
        <div id="loginMsg" class="msg hidden"></div>
        <button id="loginBtn">Войти</button>
        <button id="showRegBtn" class="btn-outline">Создать аккаунт</button>
    </div>

    <div id="regBlock" class="hidden">
        <input type="text" id="regName" placeholder="Имя">
        <input type="tel" id="regPhone" placeholder="Телефон">
        <input type="email" id="regEmail" placeholder="Email">
        <input type="password" id="regPass" placeholder="Пароль">
        <div id="regMsg" class="msg hidden"></div>
        <button id="regBtn">Зарегистрироваться</button>
        <button id="showLoginBtn" class="btn-outline">Уже есть аккаунт?</button>
    </div>
</div>

<div id="chatScreen" class="hidden">
    <div class="container" style="max-width: 600px;">
        <div class="profile-avatar" id="profileAvatar">🌈</div>
        <h1 id="userNameDisplay"></h1>
        <p id="userPhoneDisplay" class="sub"></p>
        
        <!-- ПОИСК ДРУЗЕЙ -->
        <div class="search-section">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 Найти пользователя по имени, телефону или email...">
            <div id="searchResults" class="search-results"></div>
        </div>
        
        <!-- СПИСОК ЧАТОВ -->
        <div id="chatsList" style="max-height: 200px; overflow-y: auto; margin-bottom: 15px;"></div>
        
        <!-- ТЕКУЩИЙ ЧАТ -->
        <div id="currentChatTitle" style="color: white; margin-bottom: 10px; font-weight: bold;">Выберите чат</div>
        <div class="messages-area" id="messagesArea">
            <div style="color: #aaa; text-align: center;">💬 Выберите чат слева</div>
        </div>
        
        <div style="display: flex; gap: 10px;">
            <input type="text" id="msgInput" placeholder="Сообщение..." style="margin: 0;">
            <button id="sendBtn" style="width: auto; padding: 14px 20px; margin: 0;">➤</button>
        </div>
        
        <div class="flex-row">
            <button id="changeAvatarBtn">🎨 Аватар</button>
            <button id="createChannelBtn">📢 Канал</button>
            <button id="callBtn">📞 Звонок</button>
            <button id="logoutChatBtn" style="background: #e63946;">🚪 Выйти</button>
        </div>
    </div>
</div>

<script>
    let currentUser = null;
    let allChats = [];
    let activeChat = null;
    let allUsers = [];

    function save() {
        if(currentUser) {
            localStorage.setItem('am_' + currentUser.id, JSON.stringify({
                user: currentUser,
                chats: allChats
            }));
        }
    }

    function loadAllUsers() {
        allUsers = [];
        for(let i = 0; i < localStorage.length; i++) {
            let key = localStorage.key(i);
            if(key && key.startsWith('am_') && (!currentUser || key !== 'am_' + currentUser.id)) {
                try {
                    let data = JSON.parse(localStorage.getItem(key));
                    if(data.user) allUsers.push(data.user);
                } catch(e) {}
            }
        }
    }

    function register(name, phone, email, pass) {
        if(!name || !phone || !email || !pass) return 'Заполните все поля!';
        for(let i = 0; i < localStorage.length; i++) {
            let key = localStorage.key(i);
            if(key && key.startsWith('am_')) {
                let data = JSON.parse(localStorage.getItem(key));
                if(data.user.phone === phone) return 'Телефон уже занят!';
                if(data.user.email === email) return 'Email уже занят!';
            }
        }
        let id = Date.now() + '_' + Math.random();
        currentUser = {
            id: id,
            name: name,
            phone: phone,
            email: email,
            password: pass,
            avatarType: 'emoji',
            avatarData: '🌈'
        };
        allChats = [{
            id: 'main_' + Date.now(),
            name: '🌈 Общий чат',
            messages: [{ text: 'Добро пожаловать, ' + name + '!', sender: 'system', time: new Date().toLocaleTimeString() }]
        }];
        save();
        return 'ok';
    }

    function login(id, pass) {
        for(let i = 0; i < localStorage.length; i++) {
            let key = localStorage.key(i);
            if(key && key.startsWith('am_')) {
                let data = JSON.parse(localStorage.getItem(key));
                let u = data.user;
                if((u.phone === id || u.email === id || u.name === id) && u.password === pass) {
                    currentUser = u;
                    allChats = data.chats || [];
                    if(!currentUser.avatarType) {
                        currentUser.avatarType = 'emoji';
                        currentUser.avatarData = '🌈';
                    }
                    save();
                    return true;
                }
            }
        }
        return false;
    }

    // ПОИСК ПОЛЬЗОВАТЕЛЕЙ
    function searchUsers(query) {
        if(!query.trim()) return [];
        let q = query.toLowerCase();
        return allUsers.filter(u => 
            u.name.toLowerCase().includes(q) || 
            u.phone.includes(q) || 
            u.email.toLowerCase().includes(q)
        );
    }

    // СОЗДАНИЕ ЛИЧНОГО ЧАТА
    function createPrivateChat(otherUser) {
        // Проверяем, существует ли уже чат
        let existing = allChats.find(c => 
            c.type === 'private' && 
            c.participants && 
            c.participants.includes(currentUser.id) && 
            c.participants.includes(otherUser.id)
        );
        
        if(existing) {
            activeChat = existing.id;
            document.getElementById('currentChatTitle').innerHTML = existing.name;
            renderMessages(existing);
            renderChatList();
            return;
        }
        
        // Создаём новый личный чат
        let newChat = {
            id: 'priv_' + Date.now(),
            name: otherUser.name,
            type: 'private',
            participants: [currentUser.id, otherUser.id],
            messages: [{ text: '🔒 Чат с ' + otherUser.name + ' защищён шифрованием!', sender: 'system', time: new Date().toLocaleTimeString() }]
        };
        allChats.push(newChat);
        save();
        renderChatList();
        activeChat = newChat.id;
        document.getElementById('currentChatTitle').innerHTML = newChat.name;
        renderMessages(newChat);
    }

    function addMessage(chatId, text) {
        let chat = allChats.find(c => c.id === chatId);
        if(chat) {
            chat.messages.push({ text: text, sender: currentUser.name, time: new Date().toLocaleTimeString() });
            save();
            if(activeChat === chatId) renderMessages(chat);
            renderChatList();
        }
    }

    function renderMessages(chat) {
        let container = document.getElementById('messagesArea');
        if(!chat.messages || chat.messages.length === 0) {
            container.innerHTML = '<div style="color: #aaa; text-align: center;">💬 Нет сообщений. Напишите первое!</div>';
            return;
        }
        container.innerHTML = '';
        for(let i = 0; i < chat.messages.length; i++) {
            let msg = chat.messages[i];
            let isMy = msg.sender === currentUser.name;
            let div = document.createElement('div');
            div.className = isMy ? 'my-message' : 'other-message';
            div.innerHTML = '<div class="bubble"><b>' + (msg.sender !== 'system' ? msg.sender : '📢') + '</b><br>' + msg.text + '<div class="time">' + msg.time + '</div></div>';
            container.appendChild(div);
        }
        container.scrollTop = container.scrollHeight;
    }

    function renderChatList() {
        let container = document.getElementById('chatsList');
        if(!allChats.length) {
            container.innerHTML = '<div style="color: #aaa; padding: 15px; text-align: center;">Нет чатов. Найдите друзей через поиск!</div>';
            return;
        }
        container.innerHTML = '';
        for(let i = 0; i < allChats.length; i++) {
            let chat = allChats[i];
            let div = document.createElement('div');
            div.className = 'chat-item';
            if(activeChat === chat.id) div.classList.add('active');
            div.innerHTML = '<div><b>' + chat.name + '</b><br><span style="font-size: 11px;">🔒 Защищён</span></div>';
            div.onclick = (function(c) { return function() {
                activeChat = c.id;
                document.getElementById('currentChatTitle').innerHTML = c.name;
                renderMessages(c);
                renderChatList();
            }; })(chat);
            container.appendChild(div);
        }
    }

    function createChannel() {
        let name = prompt('Название канала:');
        if(name && name.trim()) {
            allChats.push({
                id: 'ch_' + Date.now(),
                name: name,
                type: 'channel',
                messages: [{ text: '✨ Канал "' + name + '" создан!', sender: 'system', time: new Date().toLocaleTimeString() }]
            });
            save();
            renderChatList();
        }
    }

    // АВАТАР
    function updateAvatarDisplay() {
        let container = document.getElementById('profileAvatar');
        container.innerHTML = '';
        if(currentUser.avatarType === 'image' && currentUser.avatarData) {
            let img = document.createElement('img');
            img.src = currentUser.avatarData;
            container.appendChild(img);
        } else {
            container.innerText = currentUser.avatarData || '🌈';
            container.style.fontSize = '40px';
            container.style.display = 'flex';
            container.style.alignItems = 'center';
            container.style.justifyContent = 'center';
        }
    }

    function showAvatarModal() {
        let modal = document.createElement('div');
        modal.className = 'modal';
        
        let emojis = ['🌈', '🌟', '🦄', '🎨', '💖', '✨', '🌸', '🐱', '⭐', '👑', '😎', '🤖'];
        let emojiHtml = '';
        for(let i = 0; i < emojis.length; i++) {
            emojiHtml += '<span class="avatar-emoji" data-emoji="' + emojis[i] + '">' + emojis[i] + '</span>';
        }
        
        modal.innerHTML = `
            <div class="modal-content">
                <h3>🎨 Выберите аватар</h3>
                <div style="margin-bottom: 15px;">
                    <div id="photoPreview" style="width: 80px; height: 80px; border-radius: 50%; background: #1a0b2e; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; overflow: hidden;">📷</div>
                    <button id="uploadPhotoBtn" style="background: #4a8c7e; margin: 10px 0;">📸 Загрузить фото из галереи</button>
                    <input type="file" id="fileInput" accept="image/*" style="display: none;">
                </div>
                <div style="border-top: 1px solid #ff77aa; margin: 15px 0;"></div>
                <div id="emojiGrid">${emojiHtml}</div>
                <button id="closeModalBtn" class="close-btn">Закрыть</button>
            </div>
        `;
        document.body.appendChild(modal);
        
        document.querySelectorAll('.avatar-emoji').forEach(opt => {
            opt.onclick = function() {
                currentUser.avatarType = 'emoji';
                currentUser.avatarData = this.getAttribute('data-emoji');
                updateAvatarDisplay();
                save();
                modal.remove();
                alert('✅ Аватар изменён!');
            };
        });
        
        let fileInput = document.getElementById('fileInput');
        document.getElementById('uploadPhotoBtn').onclick = () => fileInput.click();
        
        fileInput.onchange = (e) => {
            let file = e.target.files[0];
            if(file && file.type.startsWith('image/')) {
                if(file.size > 5 * 1024 * 1024) {
                    alert('❌ Файл слишком большой (макс. 5MB)');
                    return;
                }
                let reader = new FileReader();
                reader.onload = (ev) => {
                    currentUser.avatarType = 'image';
                    currentUser.avatarData = ev.target.result;
                    updateAvatarDisplay();
                    save();
                    modal.remove();
                    alert('✅ Фото загружено! Аватар изменён.');
                };
                reader.readAsDataURL(file);
            } else {
                alert('❌ Выберите изображение');
            }
        };
        
        document.getElementById('closeModalBtn').onclick = () => modal.remove();
    }

    function showChatUI() {
        document.getElementById('authScreen').classList.add('hidden');
        document.getElementById('chatScreen').classList.remove('hidden');
        document.getElementById('userNameDisplay').innerHTML = currentUser.name;
        document.getElementById('userPhoneDisplay').innerHTML = '📞 ' + currentUser.phone;
        updateAvatarDisplay();
        loadAllUsers();
        renderChatList();
        
        // Настройка поиска
        let searchInput = document.getElementById('searchInput');
        let resultsDiv = document.getElementById('searchResults');
        
        searchInput.oninput = function() {
            let results = searchUsers(this.value);
            if(results.length > 0 && this.value.trim()) {
                resultsDiv.style.display = 'block';
                resultsDiv.innerHTML = '';
                for(let i = 0; i < results.length; i++) {
                    let user = results[i];
                    let div = document.createElement('div');
                    div.className = 'search-item';
                    div.innerHTML = '<span>' + (user.avatarData || '👤') + ' ' + user.name + '<br><span style="font-size: 10px;">📞 ' + user.phone + '</span></span><button>💬 Написать</button>';
                    div.onclick = () => createPrivateChat(user);
                    resultsDiv.appendChild(div);
                }
            } else {
                resultsDiv.style.display = 'none';
            }
        };
        
        if(allChats.length) {
            activeChat = allChats[0].id;
            document.getElementById('currentChatTitle').innerHTML = allChats[0].name;
            renderMessages(allChats[0]);
        }
    }

    // КНОПКИ
    document.getElementById('loginBtn').onclick = function() {
        let id = document.getElementById('loginId').value.trim();
        let pass = document.getElementById('loginPass').value.trim();
        let msgDiv = document.getElementById('loginMsg');
        if(!id || !pass) {
            msgDiv.classList.remove('hidden');
            msgDiv.className = 'msg error';
            msgDiv.innerText = 'Заполните поля!';
            return;
        }
        if(login(id, pass)) {
            showChatUI();
        } else {
            msgDiv.classList.remove('hidden');
            msgDiv.className = 'msg error';
            msgDiv.innerText = 'Неверные данные!';
        }
    };

    document.getElementById('regBtn').onclick = function() {
        let name = document.getElementById('regName').value.trim();
        let phone = document.getElementById('regPhone').value.trim();
        let email = document.getElementById('regEmail').value.trim();
        let pass = document.getElementById('regPass').value.trim();
        let msgDiv = document.getElementById('regMsg');
        let res = register(name, phone, email, pass);
        if(res === 'ok') {
            msgDiv.classList.remove('hidden');
            msgDiv.className = 'msg success';
            msgDiv.innerText = '✅ Аккаунт создан!';
            setTimeout(() => { showChatUI(); }, 1500);
        } else {
            msgDiv.classList.remove('hidden');
            msgDiv.className = 'msg error';
            msgDiv.innerText = res;
        }
    };

    document.getElementById('showRegBtn').onclick = function() {
        document.getElementById('loginBlock').classList.add('hidden');
        document.getElementById('regBlock').classList.remove('hidden');
    };

    document.getElementById('showLoginBtn').onclick = function() {
        document.getElementById('regBlock').classList.add('hidden');
        document.getElementById('loginBlock').classList.remove('hidden');
    };

    document.getElementById('sendBtn').onclick = function() {
        let input = document.getElementById('msgInput');
        if(activeChat && input.value.trim()) {
            addMessage(activeChat, input.value.trim());
            input.value = '';
        }
    };

    document.getElementById('msgInput').addEventListener('keypress', function(e) {
        if(e.key === 'Enter') document.getElementById('sendBtn').click();
    });

    document.getElementById('changeAvatarBtn').onclick = showAvatarModal;
    document.getElementById('createChannelBtn').onclick = createChannel;
    
    document.getElementById('callBtn').onclick = function() {
        if(activeChat) {
            alert('📞 Защищённый звонок!');
            addMessage(activeChat, '🔊 Аудиозвонок');
        } else {
            alert('Сначала выберите чат');
        }
    };

    document.getElementById('logoutChatBtn').onclick = function() {
        currentUser = null;
        document.getElementById('chatScreen').classList.add('hidden');
        document.getElementById('authScreen').classList.remove('hidden');
        document.getElementById('loginBlock').classList.remove('hidden');
        document.getElementById('regBlock').classList.add('hidden');
        document.getElementById('loginId').value = '';
        document.getElementById('loginPass').value = '';
    };
</script>
</body>
</html>
