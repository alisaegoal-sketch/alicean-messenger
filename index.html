<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alicean — Радужный мессенджер</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        body {
            background: radial-gradient(circle at 20% 30%, #1a0b2e, #0a0515);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        @keyframes rainbow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: rgba(30, 20, 50, 0.95);
            border-radius: 32px;
            padding: 40px;
            border: 1px solid rgba(255,200,200,0.3);
        }
        h1 {
            text-align: center;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #ff0a54, #ff9f4a, #ffd166, #6a4eff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-size: 32px;
        }
        .sub {
            color: #b0a0d0;
            text-align: center;
            margin-bottom: 25px;
        }
        input {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            background: #2a1a3e;
            border: 1px solid #8a6ab0;
            border-radius: 30px;
            color: white;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #ff6a8a, #c55cff);
            border: none;
            border-radius: 30px;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
        }
        .switch {
            background: transparent;
            border: 1px solid #ff77aa;
        }
        .msg {
            text-align: center;
            margin-top: 15px;
            padding: 8px;
            border-radius: 15px;
            font-size: 13px;
        }
        .error { background: #ff4444; color: white; }
        .success { background: #44ff44; color: #1a0b2e; }
        
        /* Чат */
        .chat-layout {
            display: flex;
            width: 1300px;
            max-width: 100%;
            height: 85vh;
            background: rgba(30, 20, 50, 0.95);
            border-radius: 32px;
            overflow: hidden;
            border: 2px solid transparent;
            animation: borderPulse 2s infinite;
        }
        @keyframes borderPulse {
            0% { border-color: #ff0a54; }
            50% { border-color: #6a4eff; }
            100% { border-color: #ff0a54; }
        }
        .sidebar {
            width: 300px;
            background: rgba(20, 10, 35, 0.9);
            padding: 20px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #3a2a5a;
        }
        .profile {
            color: white;
            padding-bottom: 20px;
            border-bottom: 1px solid #3a2a5a;
            margin-bottom: 15px;
        }
        .profile-avatar {
            font-size: 48px;
            margin-bottom: 10px;
            cursor: pointer;
        }
        .security {
            background: #00ff9d20;
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 11px;
            display: inline-block;
            margin-top: 10px;
            color: #00ff9d;
        }
        .chats-list {
            flex: 1;
            overflow-y: auto;
        }
        .chat-item {
            background: #2a1a3e;
            padding: 12px;
            border-radius: 20px;
            margin-bottom: 8px;
            cursor: pointer;
        }
        .chat-item.active {
            background: linear-gradient(95deg, #b259ff, #ff77aa);
        }
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .chat-header {
            padding: 20px;
            background: #1f103f;
            color: white;
            font-weight: bold;
            border-bottom: 1px solid #3a2a5a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        .my-message {
            text-align: right;
            margin: 10px 0;
        }
        .my-message .bubble {
            background: linear-gradient(135deg, #c55cff, #ff6a8a);
            display: inline-block;
            padding: 10px 16px;
            border-radius: 20px;
            max-width: 70%;
            color: white;
        }
        .other-message {
            text-align: left;
            margin: 10px 0;
        }
        .other-message .bubble {
            background: #2a1a3e;
            display: inline-block;
            padding: 10px 16px;
            border-radius: 20px;
            max-width: 70%;
            color: white;
        }
        .time {
            font-size: 10px;
            opacity: 0.6;
            margin-top: 4px;
        }
        .input-row {
            padding: 20px;
            display: flex;
            gap: 10px;
            background: #1f103f;
        }
        .input-row input {
            margin: 0;
            flex: 1;
        }
        .input-row button {
            width: auto;
            margin: 0;
            padding: 12px 25px;
        }
        .btn-icon {
            background: #e63946;
            margin-top: 10px;
        }
        .btn-small {
            padding: 8px 12px;
            font-size: 12px;
            margin: 5px 0;
        }
        .flex-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .flex-buttons button {
            flex: 1;
            margin: 5px 0;
        }
    </style>
</head>
<body>

<!-- ЭКРАН ВХОДА -->
<div id="loginScreen" class="container">
    <h1>🌈 Alicean</h1>
    <p class="sub">🔒 Безопасный радужный мессенджер</p>
    
    <div id="loginForm">
        <input type="text" id="loginId" placeholder="Телефон, Email или Имя">
        <input type="password" id="loginPass" placeholder="Пароль">
        <div id="loginMsg" class="msg"></div>
        <button id="loginBtn">🔐 Войти</button>
        <button id="showRegBtn" class="switch">✨ Создать аккаунт</button>
    </div>

    <div id="regForm" style="display: none;">
        <input type="text" id="regName" placeholder="Имя пользователя">
        <input type="tel" id="regPhone" placeholder="Телефон">
        <input type="email" id="regEmail" placeholder="Email">
        <input type="password" id="regPass" placeholder="Пароль">
        <div id="regMsg" class="msg"></div>
        <button id="regBtn">📝 Зарегистрироваться</button>
        <button id="showLoginBtn" class="switch">🔐 Уже есть аккаунт?</button>
    </div>
</div>

<!-- ЧАТ -->
<div id="chatScreen" style="display: none;">
    <div class="chat-layout">
        <div class="sidebar">
            <div class="profile">
                <div class="profile-avatar" id="profileAvatar" onclick="openSettings()">🌈</div>
                <strong id="userName"></strong><br>
                <span id="userPhone"></span>
                <div><span class="security">🔒 E2EE AES-256</span></div>
            </div>
            <div class="chats-list" id="chatsList"></div>
            <div class="flex-buttons">
                <button id="newChannelBtn">📢 Канал</button>
                <button id="callBtn">📞 Звонок</button>
                <button id="giftBtn">🎁 Подарок</button>
                <button id="premiumBtn">⭐ Premium</button>
            </div>
            <button id="logoutChatBtn" class="btn-icon">🚪 Выйти</button>
        </div>
        <div class="main-chat">
            <div class="chat-header">
                <span id="chatTitle">Выберите чат</span>
                <button id="settingsChatBtn" style="width: auto; padding: 6px 12px; margin: 0;">⚙️</button>
            </div>
            <div class="messages-area" id="messagesArea">
                <div style="color: #aaa; text-align: center;">💬 Нажмите на чат слева</div>
            </div>
            <div class="input-row">
                <input type="text" id="msgInput" placeholder="🔒 Сообщение...">
                <button id="sendMsgBtn">➤</button>
            </div>
        </div>
    </div>
</div>

<script>
    // ========== ДАННЫЕ ==========
    let currentUser = null;
    let chats = [];
    let activeChat = null;

    // Подарки
    const gifts = [
        { emoji: '🌹', name: 'Роза' },
        { emoji: '🎂', name: 'Торт' },
        { emoji: '💖', name: 'Сердце' },
        { emoji: '⭐', name: 'Звезда' },
        { emoji: '👑', name: 'Корона' }
    ];

    function saveData() {
        if(currentUser) {
            localStorage.setItem(`alicean_${currentUser.id}`, JSON.stringify({
                user: currentUser,
                chats: chats
            }));
        }
    }

    // ========== РЕГИСТРАЦИЯ ==========
    function registerUser(name, phone, email, pass) {
        if(!name || !phone || !email || !pass) return { ok: false, error: "Заполните все поля!" };
        
        for(let i = 0; i < localStorage.length; i++) {
            let key = localStorage.key(i);
            if(key && key.startsWith('alicean_')) {
                let data = JSON.parse(localStorage.getItem(key));
                if(data.user.phone === phone) return { ok: false, error: "Телефон уже занят!" };
                if(data.user.email === email) return { ok: false, error: "Email уже занят!" };
            }
        }
        
        let id = Date.now() + "_" + Math.random();
        currentUser = {
            id: id,
            name: name,
            phone: phone,
            email: email,
            password: pass,
            avatar: "🌈"
        };
        
        chats = [{
            id: "welcome",
            name: "🌈 Главный чат",
            messages: [{
                text: `✨ Добро пожаловать, ${name}! Это ваш защищённый чат. 🔒`,
                sender: "system",
                time: new Date().toLocaleTimeString()
            }]
        }];
        
        saveData();
        return { ok: true };
    }

    // ========== ВХОД ==========
    function loginUser(identifier, pass) {
        for(let i = 0; i < localStorage.length; i++) {
            let key = localStorage.key(i);
            if(key && key.startsWith('alicean_')) {
                let data = JSON.parse(localStorage.getItem(key));
                let u = data.user;
                if((u.phone === identifier || u.email === identifier || u.name === identifier) && u.password === pass) {
                    currentUser = u;
                    chats = data.chats || [];
                    saveData();
                    return { ok: true };
                }
            }
        }
        return { ok: false, error: "Неверные данные!" };
    }

    // ========== СООБЩЕНИЯ ==========
    function addMessage(chatId, text) {
        let chat = chats.find(c => c.id === chatId);
        if(chat) {
            chat.messages.push({
                text: text,
                sender: currentUser.name,
                time: new Date().toLocaleTimeString()
            });
            saveData();
            if(activeChat === chatId) renderMessages(chat);
            renderChats();
        }
    }

    function renderMessages(chat) {
        let container = document.getElementById('messagesArea');
        if(!chat.messages || chat.messages.length === 0) {
            container.innerHTML = '<div style="color: #aaa; text-align: center;">💬 Нет сообщений. Напишите первое!</div>';
            return;
        }
        container.innerHTML = '';
        chat.messages.forEach(msg => {
            let isMy = msg.sender === currentUser.name;
            let div = document.createElement('div');
            div.className = isMy ? 'my-message' : 'other-message';
            div.innerHTML = `<div class="bubble"><b>${msg.sender !== 'system' ? msg.sender : '📢 Система'}</b><br>${msg.text}<div class="time">${msg.time} 🔒</div></div>`;
            container.appendChild(div);
        });
        container.scrollTop = container.scrollHeight;
    }

    function renderChats() {
        let container = document.getElementById('chatsList');
        if(!chats.length) {
            container.innerHTML = '<div style="color: #aaa;">Нет чатов. Создайте канал!</div>';
            return;
        }
        container.innerHTML = '';
        chats.forEach(chat => {
            let div = document.createElement('div');
            div.className = 'chat-item';
            if(activeChat === chat.id) div.classList.add('active');
            div.innerHTML = `<b>${chat.name}</b><br><span style="font-size: 11px;">🔒 Защищён</span>`;
            div.onclick = () => {
                activeChat = chat.id;
                document.getElementById('chatTitle').innerHTML = chat.name;
                renderMessages(chat);
                renderChats();
            };
            container.appendChild(div);
        });
    }

    // ========== ФУНКЦИИ ==========
    function createChannel() {
        let name = prompt("🌈 Название канала:");
        if(name && name.trim()) {
            chats.push({
                id: "ch_" + Date.now(),
                name: name,
                messages: [{ text: `✨ Канал "${name}" создан!`, sender: "system", time: new Date().toLocaleTimeString() }]
            });
            saveData();
            renderChats();
        }
    }

    function makeCall() {
        if(!activeChat) { alert("Сначала выберите чат"); return; }
        alert("📞 Защищённый звонок!\n🔒 Сквозное шифрование активно (DTLS-SRTP)");
        addMessage(activeChat, "🔊 Совершён защищённый аудиозвонок");
    }

    function showGifts() {
        if(!activeChat) { alert("Сначала выберите чат"); return; }
        let giftList = gifts.map(g => `${g.emoji} ${g.name}`).join("\n");
        let choice = prompt("🎁 Выберите подарок:\n" + giftList + "\n\nВведите номер:\n1-🌹 2-🎂 3-💖 4-⭐ 5-👑");
        if(choice) {
            let gift = gifts[parseInt(choice)-1];
            if(gift) {
                addMessage(activeChat, `🎁 Подарок: ${gift.emoji} ${gift.name} от ${currentUser.name}! 💝`);
            }
        }
    }

    function showPremium() {
        if(currentUser.isPremium) {
            alert("⭐ У вас уже есть Premium!");
            return;
        }
        let buy = confirm("⭐ Alicean Premium\n💰 100 ₽ / месяц\n\n🎁 Эксклюзивные подарки\n🌟 Особый значок\n🔒 Приоритетная поддержка\n\nКупить Premium?");
        if(buy) {
            currentUser.isPremium = true;
            saveData();
            alert("✅ Premium активирован! Спасибо за покупку!");
        }
    }

    function openSettings() {
        let newName = prompt("Изменить имя:", currentUser.name);
        if(newName && newName.trim()) {
            currentUser.name = newName.trim();
            saveData();
            document.getElementById('userName').innerHTML = currentUser.name;
            alert("✅ Имя изменено!");
        }
        let newAvatar = prompt("Выберите аватар (эмодзи):\n🌈 🌟 🦄 🎨 💖 ✨ 🌸 🐱 ⭐", currentUser.avatar);
        if(newAvatar && newAvatar.trim()) {
            currentUser.avatar = newAvatar.trim();
            saveData();
            document.getElementById('profileAvatar').innerHTML = currentUser.avatar;
        }
    }

    function showChat() {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('chatScreen').style.display = 'block';
        document.getElementById('userName').innerHTML = currentUser.name;
        document.getElementById('userPhone').innerHTML = `📞 ${currentUser.phone} | ✉️ ${currentUser.email}`;
        document.getElementById('profileAvatar').innerHTML = currentUser.avatar || '🌈';
        renderChats();
        if(chats.length) {
            activeChat = chats[0].id;
            document.getElementById('chatTitle').innerHTML = chats[0].name;
            renderMessages(chats[0]);
        }
        if(currentUser.isPremium) {
            document.getElementById('premiumBtn').style.background = "#ffd700";
            document.getElementById('premiumBtn').style.color = "#1a0b2e";
        }
    }

    // ========== НАСТРОЙКА КНОПОК ==========
    document.getElementById('loginBtn').onclick = () => {
        let id = document.getElementById('loginId').value.trim();
        let pass = document.getElementById('loginPass').value.trim();
        let msgDiv = document.getElementById('loginMsg');
        if(!id || !pass) { msgDiv.className = 'msg error'; msgDiv.innerText = "Заполните поля!"; return; }
        let res = loginUser(id, pass);
        if(res.ok) {
            showChat();
        } else {
            msgDiv.className = 'msg error';
            msgDiv.innerText = res.error;
        }
    };

    document.getElementById('regBtn').onclick = () => {
        let name = document.getElementById('regName').value.trim();
        let phone = document.getElementById('regPhone').value.trim();
        let email = document.getElementById('regEmail').value.trim();
        let pass = document.getElementById('regPass').value.trim();
        let msgDiv = document.getElementById('regMsg');
        let res = registerUser(name, phone, email, pass);
        if(res.ok) {
            msgDiv.className = 'msg success';
            msgDiv.innerText = "✅ Аккаунт создан! Вход...";
            setTimeout(() => { showChat(); }, 1500);
        } else {
            msgDiv.className = 'msg error';
            msgDiv.innerText = res.error;
        }
    };

    document.getElementById('showRegBtn').onclick = () => {
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('regForm').style.display = 'block';
    };

    document.getElementById('showLoginBtn').onclick = () => {
        document.getElementById('loginForm').style.display = 'block';
        document.getElementById('regForm').style.display = 'none';
    };

    document.getElementById('sendMsgBtn').onclick = () => {
        let input = document.getElementById('msgInput');
        if(activeChat && input.value.trim()) {
            addMessage(activeChat, input.value.trim());
            input.value = '';
        } else if(!activeChat) {
            alert("Сначала выберите чат");
        }
    };

    document.getElementById('msgInput').addEventListener('keypress', (e) => {
        if(e.key === 'Enter') document.getElementById('sendMsgBtn').click();
    });

    document.getElementById('newChannelBtn').onclick = createChannel;
    document.getElementById('callBtn').onclick = makeCall;
    document.getElementById('giftBtn').onclick = showGifts;
    document.getElementById('premiumBtn').onclick = showPremium;
    
    document.getElementById('settingsChatBtn').onclick = openSettings;
    document.getElementById('profileAvatar').onclick = openSettings;

    document.getElementById('logoutChatBtn').onclick = () => {
        currentUser = null;
        document.getElementById('loginScreen').style.display = 'block';
        document.getElementById('chatScreen').style.display = 'none';
        document.getElementById('loginForm').style.display = 'block';
        document.getElementById('regForm').style.display = 'none';
        document.getElementById('loginId').value = '';
        document.getElementById('loginPass').value = '';
        document.getElementById('regName').value = '';
        document.getElementById('regPhone').value = '';
        document.getElementById('regEmail').value = '';
        document.getElementById('regPass').value = '';
    };
</script>
</body>
</html>
