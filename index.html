<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alicean | Мессенджер</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui; }
    body {
      background: linear-gradient(135deg, #1a0b2e, #0a0515);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .auth-box {
      background: rgba(22,12,38,0.9);
      backdrop-filter: blur(16px);
      padding: 40px;
      border-radius: 48px;
      width: 400px;
      text-align: center;
      border: 1px solid #ffbd9f;
    }
    h2 { color: white; margin-bottom: 20px; }
    input {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      background: #2f224b;
      border: none;
      border-radius: 40px;
      color: white;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      background: linear-gradient(90deg, #ff6a8a, #b1549b);
      border: none;
      border-radius: 40px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .toggle {
      background: #5a4a7a;
      margin-top: 5px;
    }
    .error { color: #ff8888; margin-top: 10px; font-size: 14px; }
    .success { color: #88ff88; margin-top: 10px; }
    .chat-container {
      display: none;
      width: 100vw;
      height: 100vh;
      background: rgba(22,12,38,0.9);
    }
  </style>
</head>
<body>
<div id="authScreen">
  <div class="auth-box">
    <h2 id="formTitle">🔐 Регистрация</h2>
    <input type="text" id="name" placeholder="Имя">
    <input type="tel" id="phone" placeholder="Телефон">
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Пароль">
    <div id="message"></div>
    <button id="submitBtn">Зарегистрироваться</button>
    <button id="toggleBtn" class="toggle">🔐 Уже есть аккаунт? Войти</button>
  </div>
</div>
<div id="chatScreen" class="chat-container" style="display:none">
  <div style="padding:20px; color:white; text-align:center;">
    <h2>✅ Вы вошли в мессенджер!</h2>
    <p id="welcomeName"></p>
    <button id="logoutBtn" style="width:auto; margin-top:20px;">Выйти</button>
  </div>
</div>

<script>
  let currentUser = null;
  
  function saveUser(user) {
    localStorage.setItem(`user_${user.id}`, JSON.stringify(user));
    localStorage.setItem('currentUserId', user.id);
  }
  
  function getUsers() {
    let users = [];
    for(let i=0; i<localStorage.length; i++) {
      let key = localStorage.key(i);
      if(key && key.startsWith('user_')) {
        users.push(JSON.parse(localStorage.getItem(key)));
      }
    }
    return users;
  }
  
  function register(name, phone, email, pass) {
    if(!name || !phone || !email || !pass) return "Заполните все поля!";
    let users = getUsers();
    for(let u of users) {
      if(u.phone === phone) return "Телефон уже занят";
      if(u.email === email) return "Email уже занят";
    }
    let id = Date.now() + "_" + Math.random();
    let user = { id, name, phone, email, password: pass };
    saveUser(user);
    return "ok";
  }
  
  function login(identifier, pass) {
    let users = getUsers();
    for(let u of users) {
      if((u.phone === identifier || u.email === identifier || u.name === identifier) && u.password === pass) {
        currentUser = u;
        localStorage.setItem('currentUserId', u.id);
        return true;
      }
    }
    return false;
  }
  
  let isLogin = false;
  
  function updateUI() {
    if(currentUser) {
      document.getElementById('authScreen').style.display = 'none';
      document.getElementById('chatScreen').style.display = 'block';
      document.getElementById('welcomeName').innerText = `Добро пожаловать, ${currentUser.name}!`;
    } else {
      document.getElementById('authScreen').style.display = 'flex';
      document.getElementById('chatScreen').style.display = 'none';
      document.getElementById('authScreen').style.justifyContent = 'center';
      document.getElementById('authScreen').style.alignItems = 'center';
      document.getElementById('authScreen').style.minHeight = '100vh';
    }
  }
  
  function checkSavedUser() {
    let savedId = localStorage.getItem('currentUserId');
    if(savedId) {
      let userData = localStorage.getItem(`user_${savedId}`);
      if(userData) {
        currentUser = JSON.parse(userData);
        updateUI();
      }
    }
  }
  
  document.getElementById('submitBtn').onclick = () => {
    let msgDiv = document.getElementById('message');
    if(!isLogin) {
      let name = document.getElementById('name').value.trim();
      let phone = document.getElementById('phone').value.trim();
      let email = document.getElementById('email').value.trim();
      let pass = document.getElementById('password').value.trim();
      let res = register(name, phone, email, pass);
      if(res === "ok") {
        msgDiv.className = 'success';
        msgDiv.innerText = "✅ Регистрация успешна! Теперь войдите.";
        isLogin = true;
        document.getElementById('formTitle').innerText = "🔐 Вход";
        document.getElementById('submitBtn').innerText = "Войти";
        document.getElementById('toggleBtn').innerText = "✨ Создать аккаунт";
        document.getElementById('name').value = '';
        document.getElementById('phone').value = '';
        document.getElementById('email').value = '';
        document.getElementById('password').value = '';
      } else {
        msgDiv.className = 'error';
        msgDiv.innerText = res;
      }
    } else {
      let identifier = document.getElementById('name').value.trim();
      let pass = document.getElementById('password').value.trim();
      if(login(identifier, pass)) {
        updateUI();
      } else {
        msgDiv.className = 'error';
        msgDiv.innerText = "Неверные данные!";
      }
    }
  };
  
  document.getElementById('toggleBtn').onclick = () => {
    isLogin = !isLogin;
    let msgDiv = document.getElementById('message');
    msgDiv.innerText = '';
    if(isLogin) {
      document.getElementById('formTitle').innerText = "🔐 Вход";
      document.getElementById('submitBtn').innerText = "Войти";
      document.getElementById('toggleBtn').innerText = "✨ Создать аккаунт";
      document.getElementById('name').placeholder = "Телефон / Email / Имя";
      document.getElementById('phone').style.display = 'none';
      document.getElementById('email').style.display = 'none';
    } else {
      document.getElementById('formTitle').innerText = "🔐 Регистрация";
      document.getElementById('submitBtn').innerText = "Зарегистрироваться";
      document.getElementById('toggleBtn').innerText = "🔐 Уже есть аккаунт? Войти";
      document.getElementById('name').placeholder = "Имя";
      document.getElementById('phone').style.display = 'block';
      document.getElementById('email').style.display = 'block';
    }
  };
  
  document.getElementById('logoutBtn').onclick = () => {
    currentUser = null;
    localStorage.removeItem('currentUserId');
    updateUI();
    isLogin = false;
    document.getElementById('name').placeholder = "Имя";
    document.getElementById('phone').style.display = 'block';
    document.getElementById('email').style.display = 'block';
    document.getElementById('formTitle').innerText = "🔐 Регистрация";
    document.getElementById('submitBtn').innerText = "Зарегистрироваться";
    document.getElementById('toggleBtn').innerText = "🔐 Уже есть аккаунт? Войти";
    document.getElementById('message').innerText = '';
  };
  
  checkSavedUser();
</script>
</body>
</html>
