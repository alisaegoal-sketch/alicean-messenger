<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Alicean | Радужный мессенджер</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Quicksand', system-ui, -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
        }

        body {
            background: radial-gradient(circle at 20% 30%, #1a0b2e, #0a0515);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        /* Адаптивный контейнер */
        .app-container {
            width: 100%;
            max-width: 1400px;
            height: 95vh;
            max-height: 95vh;
            background: rgba(22, 12, 38, 0.6);
            backdrop-filter: blur(16px);
            border-radius: 28px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* Радужная анимация */
        @keyframes rainbowFlow {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        @keyframes borderPulse {
            0% { border-color: #ff0a54; box-shadow: 0 0 5px #ff0a54; }
            50% { border-color: #6a4eff; box-shadow: 0 0 20px #6a4eff; }
            100% { border-color: #ff0a54; box-shadow: 0 0 5px #ff0a54; }
        }

        .app-container::before {
            content: '';
            position: absolute;
            top: -4px;
            left: -4px;
            right: -4px;
            bottom: -4px;
            background: linear-gradient(135deg, #ff0a54, #ff477e, #ff9f4a, #ffd166, #6a4eff, #c77dff, #ff0a54);
            background-size: 300% 300%;
            border-radius: 32px;
            z-index: -1;
            opacity: 0.7;
            filter: blur(12px);
            animation: rainbowFlow 6s ease infinite;
        }

        /* Адаптивный макет */
        .main-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Боковая панель - адаптивная ширина */
        .chats-sidebar {
            width: 280px;
            min-width: 250px;
            background: rgba(12, 6, 25, 0.7);
            backdrop-filter: blur(12px);
            border-right: 1px solid rgba(255, 210, 210, 0.2);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
        }

        .user-profile {
            padding: 16px;
            background: linear-gradient(115deg, #2a1a4a80, #1f103f80);
            border-bottom: 2px solid #ff8cae40;
            cursor: pointer;
            position: relative;
        }
        .security-level {
            position: absolute;
            top: 8px;
            right: 12px;
            background: #00ff9d20;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 0.55rem;
            color: #00ff9d;
        }
        .profile-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .profile-avatar {
            width: 48px;
            height: 48px;
            background: linear-gradient(145deg, #ffb347, #ff6b9d);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-size: 24px;
            cursor: pointer;
        }
        .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .profile-info h3 { color: white; font-size: 0.95rem; }
        .profile-info p { font-size: 0.6rem; color: #f3c6ff; }

        .search-section {
            padding: 10px;
            border-bottom: 1px solid rgba(255,200,200,0.2);
        }
        .search-input {
            width: 100%;
            padding: 8px 12px;
            background: #2a1b46;
            border: 1px solid #ffaa6640;
            border-radius: 30px;
            color: white;
            font-size: 13px;
            outline: none;
        }
        .search-results {
            max-height: 180px;
            overflow-y: auto;
            margin-top: 8px;
            background: #1e1135;
            border-radius: 20px;
            display: none;
        }
        .search-result-item {
            padding: 8px 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #ffaa8820;
            color: white;
            font-size: 13px;
        }
        .search-result-item:hover { background: #ff77aa30; }

        .chats-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }
        .chat-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            margin-bottom: 6px;
            background: rgba(255,255,210,0.05);
            border-radius: 24px;
            cursor: pointer;
            transition: 0.2s;
        }
        .chat-item.active { background: linear-gradient(95deg, #b259ff30, #ff77aa30); border-left: 4px solid #ffb86b; }
        .chat-avatar { width: 44px; height: 44px; border-radius: 50%; background: radial-gradient(#ffbc6e, #ff6f91); display: flex; align-items: center; justify-content: center; font-size: 22px; overflow: hidden; }
        .chat-details { flex: 1; }
        .chat-name { font-weight: bold; color: #fff0e0; font-size: 0.85rem; }
        .last-msg { font-size: 0.6rem; color: #ceb5ff; }

        .action-buttons {
            padding: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .action-buttons button {
            flex: 1;
            margin: 0;
            padding: 6px;
            font-size: 0.7rem;
        }
        button {
            background: linear-gradient(90deg, #ff6a8a, #b1549b);
            border: none;
            padding: 8px 12px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.75rem;
            transition: 0.2s;
        }
        .logout-btn { background: linear-gradient(90deg, #e63946, #b91c2c); }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(0,0,0,0.2);
        }
        .chat-header-area {
            padding: 12px 16px;
            background: rgba(30, 18, 55, 0.7);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #ffb47b40;
            flex-wrap: wrap;
            gap: 8px;
        }
        .encryption-status {
            font-size: 0.65rem;
            padding: 3px 10px;
            border-radius: 20px;
            background: #00ff9d20;
            color: #00ff9d;
        }

        .messages-view {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            display: flex;
            max-width: 80%;
            animation: fadeSlide 0.2s ease;
        }
        .message.incoming { align-self: flex-start; }
        .message.outgoing { align-self: flex-end; flex-direction: row-reverse; }
        .bubble {
            padding: 8px 14px;
            border-radius: 22px;
            background: #2d1f49dd;
            color: #f2eaff;
            word-break: break-word;
            font-size: 14px;
        }
        .msg-time { font-size: 0.55rem; margin-top: 3px; color: #cbb3ff; text-align: right; }

        .input-message {
            padding: 12px;
            background: #1e1135cc;
            display: flex;
            gap: 10px;
        }
        .msg-input-field {
            flex: 1;
            background: #2b1d46;
            border-radius: 30px;
            padding: 10px 16px;
            color: white;
            outline: none;
            border: 1px solid #ffaa8840;
            font-size: 14px;
        }
        .send-msg-btn {
            background: linear-gradient(145deg, #ff7e9e, #d46cb3);
            border: none;
            width: 44px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 20px;
            color: white;
        }

        /* Модальные окна */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(12px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        .modal-card {
            width: 90%;
            max-width: 400px;
            background: #231b3c;
            border-radius: 40px;
            padding: 24px;
            border: 2px solid #ffbd9f;
            max-height: 85vh;
            overflow-y: auto;
        }
        .modal-card h2, .modal-card h3 { color: white; margin-bottom: 16px; text-align: center; font-size: 1.3rem; }
        .modal-card input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background: #2f224b;
            border: none;
            border-radius: 30px;
            color: white;
            font-size: 14px;
        }
        .error-msg { color: #ff8888; text-align: center; margin-top: 10px; font-size: 12px; }
        .success-msg { color: #88ff88; text-align: center; margin-top: 10px; font-size: 12px; }

        .avatar-preview {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(145deg, #ffb347, #ff6b9d);
            margin: 10px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            cursor: pointer;
            overflow: hidden;
        }
        .emoji-grid {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 15px 0;
        }
        .emoji-option {
            font-size: 28px;
            cursor: pointer;
            padding: 5px;
            border-radius: 50%;
            background: #2f1f4a;
        }
        .upload-photo-btn {
            background: #4a8c7e;
            margin-top: 8px;
            font-size: 12px;
        }
        .file-input { display: none; }

        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(8px);}
            to { opacity: 1; transform: translateY(0);}
        }
        .empty-chat { color: #b39eff; text-align: center; margin-top: 30px; font-size: 14px; }

        /* Адаптив для телефонов */
        @media (max-width: 768px) {
            body { padding: 5px; }
            .app-container { height: 98vh; border-radius: 20px; }
            .chats-sidebar { width: 240px; min-width: 200px; }
            .profile-avatar { width: 40px; height: 40px; font-size: 20px; }
            .chat-name { font-size: 0.75rem; }
            .message { max-width: 90%; }
            .bubble { font-size: 13px; padding: 6px 12px; }
            .modal-card { width: 95%; padding: 20px; }
            .security-level { font-size: 0.45rem; top: 5px; right: 8px; }
        }

        @media (max-width: 480px) {
            .chats-sidebar { width: 200px; min-width: 180px; }
            .profile-info h3 { font-size: 0.8rem; }
            .action-buttons button { font-size: 0.6rem; padding: 4px; }
            .chat-header-area { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>
<div class="app-container" id="appRoot" style="display: none;">
    <div class="main-layout">
        <div class="chats-sidebar">
            <div class="user-profile" id="profileBtn">
                <div class="profile-row">
                    <div class="profile-avatar" id="globalAvatar">🌈</div>
                    <div class="profile-info">
                        <h3 id="profileName"></h3>
                        <p id="profileContact"></p>
                    </div>
                </div>
                <div class="security-level">🔐 МАКС.</div>
            </div>
            <div class="search-section">
                <input type="text" class="search-input" id="searchInput" placeholder="🔍 Найти пользователя...">
                <div class="search-results" id="searchResults"></div>
            </div>
            <div class="chats-list" id="chatsList"></div>
            <div class="action-buttons">
                <button id="createChannelBtn">📢 Канал</button>
                <button id="callBtn">📞 Звонок</button>
                <button id="giftBtn">🎁 Подарок</button>
                <button id="premiumBtn">⭐ Premium</button>
                <button id="logoutBtn" class="logout-btn">🚪 Выйти</button>
            </div>
        </div>
        <div class="chat-area">
            <div class="chat-header-area">
                <span id="currentChatTitle" style="font-weight:bold; font-size:0.9rem;">Выберите чат</span>
                <span class="encryption-status">🔒 E2EE</span>
            </div>
            <div class="messages-view" id="messagesArea"><div class="empty-chat">🌈 Добро пожаловать!<br>🔍 Используйте поиск, чтобы найти друзей</div></div>
            <div class="input-message">
                <input type="text" class="msg-input-field" id="msgInput" placeholder="🔒 Сообщение...">
                <button class="send-msg-btn" id="sendBtn">➤</button>
            </div>
        </div>
    </div>
</div>

<script>
    let currentUser = null;
    let allChats = [];
    let activeChat = null;
    let allUsers = [];

    function save() {
        if(currentUser) localStorage.setItem('am_' + currentUser.id, JSON.stringify({ user: currentUser, chats: allChats }));
    }

    function loadUsers() {
        allUsers = [];
        for(let i = 0; i < localStorage.length; i++) {
            let key = localStorage.key(i);
            if(key && key.startsWith('am_') && (!currentUser || key !== 'am_' + currentUser.id)) {
                try {
                    let data = JSON.parse(localStorage.getItem(key));
                    if(data.user) allUsers.push(data.user);
                } catch(e) {}
            }
        }
    }

    function register(name, phone, email, pass) {
        if(!name || !phone || !email || !pass) return 'Заполните поля!';
        for(let i = 0; i < localStorage.length; i++) {
            let key = localStorage.key(i);
            if(key && key.startsWith('am_')) {
                let data = JSON.parse(localStorage.getItem(key));
                if(data.user.phone === phone) return 'Телефон занят!';
                if(data.user.email === email) return 'Email занят!';
            }
        }
        let id = Date.now() + '_' + Math.random();
        currentUser = { id: id, name: name, phone: phone, email: email, password: pass, avatar: '🌈' };
        allChats = [{ id: 'main', name: '🌈 Общий чат', messages: [{ text: 'Добро пожаловать, ' + name + '!', sender: 'system', time: new Date().toLocaleTimeString() }] }];
        save();
        return 'ok';
    }

    function login(id, pass) {
        for(let i = 0; i < localStorage.length; i++) {
            let key = localStorage.key(i);
            if(key && key.startsWith('am_')) {
                let data = JSON.parse(localStorage.getItem(key));
                let u = data.user;
                if((u.phone === id || u.email === id || u.name === id) && u.password === pass) {
                    currentUser = u;
                    allChats = data.chats || [];
                    if(!currentUser.avatar) currentUser.avatar = '🌈';
                    save();
                    return true;
                }
            }
        }
        return false;
    }

    function searchUsers(q) {
        if(!q.trim()) return [];
        q = q.toLowerCase();
        return allUsers.filter(u => u.name.toLowerCase().includes(q) || u.phone.includes(q) || u.email.toLowerCase().includes(q));
    }

    function createPrivateChat(other) {
        let existing = allChats.find(c => c.type === 'private' && c.participants && c.participants.includes(currentUser.id) && c.participants.includes(other.id));
        if(existing) {
            activeChat = existing.id;
            document.getElementById('currentChatTitle').innerHTML = existing.name;
            renderMessages(existing);
            renderChats();
            return;
        }
        let newChat = {
            id: 'priv_' + Date.now(),
            name: other.name,
            type: 'private',
            participants: [currentUser.id, other.id],
            messages: [{ text: '🔒 Чат с ' + other.name + ' защищён!', sender: 'system', time: new Date().toLocaleTimeString() }]
        };
        allChats.push(newChat);
        save();
        renderChats();
        activeChat = newChat.id;
        document.getElementById('currentChatTitle').innerHTML = newChat.name;
        renderMessages(newChat);
    }

    function addMessage(chatId, text) {
        let chat = allChats.find(c => c.id === chatId);
        if(chat) {
            chat.messages.push({ text: text, sender: currentUser.name, time: new Date().toLocaleTimeString() });
            save();
            if(activeChat === chatId) renderMessages(chat);
            renderChats();
        }
    }

    function renderMessages(chat) {
        let container = document.getElementById('messagesArea');
        if(!chat.messages || !chat.messages.length) {
            container.innerHTML = '<div class="empty-chat">💬 Нет сообщений</div>';
            return;
        }
        container.innerHTML = '';
        for(let i = 0; i < chat.messages.length; i++) {
            let msg = chat.messages[i];
            let isMy = msg.sender === currentUser.name;
            let div = document.createElement('div');
            div.className = `message ${isMy ? 'outgoing' : 'incoming'}`;
            div.innerHTML = `<div class="bubble"><b>${msg.sender !== 'system' ? msg.sender : '📢'}</b><br>${msg.text}<div class="msg-time">${msg.time} 🔒</div></div>`;
            container.appendChild(div);
        }
        container.scrollTop = container.scrollHeight;
    }

    function renderChats() {
        let container = document.getElementById('chatsList');
        if(!allChats.length) {
            container.innerHTML = '<div class="empty-chat" style="padding:10px;">Нет чатов<br>Найдите друзей через поиск</div>';
            return;
        }
        container.innerHTML = '';
        for(let i = 0; i < allChats.length; i++) {
            let chat = allChats[i];
            let div = document.createElement('div');
            div.className = 'chat-item';
            if(activeChat === chat.id) div.classList.add('active');
            div.innerHTML = `<div class="chat-avatar">${chat.type === 'private' ? '💬' : '📢'}</div><div class="chat-details"><div class="chat-name">${chat.name}</div><div class="last-msg">🔒 Защищён</div></div>`;
            div.onclick = (function(c) { return function() {
                activeChat = c.id;
                document.getElementById('currentChatTitle').innerHTML = c.name;
                renderMessages(c);
                renderChats();
            }; })(chat);
            container.appendChild(div);
        }
    }

    function createChannel() {
        let name = prompt('Название канала:');
        if(name && name.trim()) {
            allChats.push({ id: 'ch_' + Date.now(), name: name, type: 'channel', messages: [{ text: '✨ Канал "' + name + '" создан!', sender: 'system', time: new Date().toLocaleTimeString() }] });
            save();
            renderChats();
        }
    }

    function showSettings() {
        let modal = document.createElement('div');
        modal.className = 'modal-overlay';
        let emojis = ['🌈', '🌟', '🦄', '🎨', '💖', '✨', '🌸', '🐱', '⭐', '👑', '😎', '🤖', '🔥', '💎'];
        let emojiHtml = '';
        for(let i = 0; i < emojis.length; i++) emojiHtml += '<span class="emoji-option" data-avatar="' + emojis[i] + '">' + emojis[i] + '</span>';
        modal.innerHTML = `
            <div class="modal-card">
                <h2>⚙️ Настройки</h2>
                <div class="avatar-preview" id="settingsAvatar">${currentUser.avatar}</div>
                <div class="emoji-grid">${emojiHtml}</div>
                <button id="uploadPhotoBtn" class="upload-photo-btn">📸 Загрузить фото</button>
                <input type="file" id="fileInput" accept="image/*" class="file-input">
                <input type="text" id="settingsName" value="${currentUser.name}" placeholder="Имя">
                <input type="tel" id="settingsPhone" value="${currentUser.phone}" placeholder="Телефон">
                <input type="email" id="settingsEmail" value="${currentUser.email}" placeholder="Email">
                <div id="settingsMsg" class="success-msg"></div>
                <button id="saveSettings">💾 Сохранить</button>
                <button id="closeSettings" style="background:#5a4a7a;">Закрыть</button>
            </div>
        `;
        document.body.appendChild(modal);
        
        document.querySelectorAll('.emoji-option').forEach(opt => {
            opt.onclick = function() {
                currentUser.avatar = this.getAttribute('data-avatar');
                document.getElementById('settingsAvatar').innerHTML = currentUser.avatar;
                document.getElementById('globalAvatar').innerHTML = currentUser.avatar;
                save();
                document.getElementById('settingsMsg').innerText = '✅ Аватар изменён';
            };
        });
        
        let fileInput = document.getElementById('fileInput');
        document.getElementById('uploadPhotoBtn').onclick = () => fileInput.click();
        fileInput.onchange = (e) => {
            let file = e.target.files[0];
            if(file && file.type.startsWith('image/')) {
                let reader = new FileReader();
                reader.onload = (ev) => {
                    currentUser.avatar = ev.target.result;
                    document.getElementById('settingsAvatar').innerHTML = '<img src="' + ev.target.result + '" style="width:100%;height:100%;object-fit:cover;">';
                    document.getElementById('globalAvatar').innerHTML = '<img src="' + ev.target.result + '" style="width:100%;height:100%;object-fit:cover;">';
                    save();
                    document.getElementById('settingsMsg').innerText = '✅ Фото загружено';
                };
                reader.readAsDataURL(file);
            }
        };
        
        document.getElementById('saveSettings').onclick = () => {
            let newName = document.getElementById('settingsName').value.trim();
            let newPhone = document.getElementById('settingsPhone').value.trim();
            let newEmail = document.getElementById('settingsEmail').value.trim();
            if(newName) currentUser.name = newName;
            if(newPhone) currentUser.phone = newPhone;
            if(newEmail) currentUser.email = newEmail;
            save();
            document.getElementById('profileName').innerHTML = currentUser.name;
            document.getElementById('profileContact').innerHTML = `📞 ${currentUser.phone}`;
            document.getElementById('settingsMsg').innerText = '✅ Сохранено!';
            setTimeout(() => modal.remove(), 1200);
        };
        document.getElementById('closeSettings').onclick = () => modal.remove();
    }

    function setupSearch() {
        let searchInput = document.getElementById('searchInput');
        let resultsDiv = document.getElementById('searchResults');
        searchInput.oninput = function() {
            let results = searchUsers(this.value);
            if(results.length && this.value.trim()) {
                resultsDiv.style.display = 'block';
                resultsDiv.innerHTML = '';
                for(let i = 0; i < results.length; i++) {
                    let u = results[i];
                    let div = document.createElement('div');
                    div.className = 'search-result-item';
                    div.innerHTML = `<div style="width:32px;height:32px;border-radius:50%;background:#ff77aa;display:flex;align-items:center;justify-content:center;">${u.avatar || '👤'}</div><div style="flex:1"><b>${u.name}</b><br><span style="font-size:10px;">📞 ${u.phone}</span></div><button style="width:auto;padding:4px 12px;">💬</button>`;
                    div.querySelector('button').onclick = (e) => { e.stopPropagation(); createPrivateChat(u); searchInput.value = ''; resultsDiv.style.display = 'none'; };
                    resultsDiv.appendChild(div);
                }
            } else { resultsDiv.style.display = 'none'; }
        };
    }

    function showChatUI() {
        document.getElementById('appRoot').style.display = 'flex';
        document.getElementById('profileName').innerHTML = currentUser.name;
        document.getElementById('profileContact').innerHTML = `📞 ${currentUser.phone}`;
        document.getElementById('globalAvatar').innerHTML = currentUser.avatar;
        loadUsers();
        renderChats();
        setupSearch();
        if(allChats.length) {
            activeChat = allChats[0].id;
            document.getElementById('currentChatTitle').innerHTML = allChats[0].name;
            renderMessages(allChats[0]);
        }
    }

    function showAuth() {
        let modal = document.createElement('div');
        modal.className = 'modal-overlay';
        let isLogin = true;
        function render() {
            if(isLogin) {
                modal.innerHTML = `<div class="modal-card"><h2>🔐 Вход</h2><div style="background:#1a0b2e; border-radius:20px; padding:10px; margin-bottom:15px;"><p style="color:#00ff9d; text-align:center;">🔒 Максимальная безопасность</p></div><input type="text" id="loginId" placeholder="Телефон или Email"><input type="password" id="loginPass" placeholder="Пароль"><div id="authError" class="error-msg"></div><button id="submitBtn">Войти</button><button id="toggleBtn" style="background:#5a4a7a;">✨ Создать аккаунт</button></div>`;
            } else {
                modal.innerHTML = `<div class="modal-card"><h2>🌈 Регистрация</h2><input type="text" id="regName" placeholder="Имя"><input type="tel" id="regPhone" placeholder="Телефон"><input type="email" id="regEmail" placeholder="Email"><input type="password" id="regPass" placeholder="Пароль"><div id="regError" class="error-msg"></div><button id="submitBtn">Зарегистрироваться</button><button id="toggleBtn" style="background:#5a4a7a;">🔐 Уже есть аккаунт?</button></div>`;
            }
            document.getElementById('submitBtn').onclick = () => {
                if(isLogin) {
                    let id = document.getElementById('loginId')?.value.trim();
                    let pass = document.getElementById('loginPass')?.value.trim();
                    if(!id || !pass) { document.getElementById('authError').innerText = 'Заполните поля!'; return; }
                    if(login(id, pass)) { modal.remove(); showChatUI(); }
                    else { document.getElementById('authError').innerText = 'Неверные данные!'; }
                } else {
                    let name = document.getElementById('regName')?.value.trim();
                    let phone = document.getElementById('regPhone')?.value.trim();
                    let email = document.getElementById('regEmail')?.value.trim();
                    let pass = document.getElementById('regPass')?.value.trim();
                    let res = register(name, phone, email, pass);
                    if(res === 'ok') {
                        document.getElementById('regError').style.color = '#88ff88';
                        document.getElementById('regError').innerText = '✅ Аккаунт создан!';
                        setTimeout(() => { modal.remove(); showChatUI(); }, 1500);
                    } else { document.getElementById('regError').innerText = res; }
                }
            };
            document.getElementById('toggleBtn').onclick = () => { isLogin = !isLogin; render(); };
        }
        render();
        document.body.appendChild(modal);
    }

    function bindEvents() {
        document.getElementById('sendBtn').onclick = () => {
            let input = document.getElementById('msgInput');
            if(activeChat && input.value.trim()) { addMessage(activeChat, input.value.trim()); input.value = ''; }
        };
        document.getElementById('msgInput').addEventListener('keypress', (e) => { if(e.key === 'Enter') document.getElementById('sendBtn').click(); });
        document.getElementById('createChannelBtn').onclick = createChannel;
        document.getElementById('callBtn').onclick = () => { if(activeChat) { alert('📞 Защищённый звонок!'); addMessage(activeChat, '🔊 Аудиозвонок'); } else alert('Выберите чат'); };
        document.getElementById('giftBtn').onclick = () => { if(activeChat) { let gifts = ['🌹 Роза', '🎂 Торт', '💖 Сердце', '⭐ Звезда', '👑 Корона']; let c = prompt('Подарок:\n1-🌹 2-🎂 3-💖 4-⭐ 5-👑'); if(c>=1 && c<=5) addMessage(activeChat, '🎁 Подарок: ' + gifts[c-1] + ' от ' + currentUser.name); } else alert('Выберите чат'); };
        document.getElementById('premiumBtn').onclick = () => { if(confirm('⭐ Premium за 100₽?')) alert('✅ Premium активирован!'); };
        document.getElementById('profileBtn').onclick = showSettings;
        document.getElementById('logoutBtn').onclick = () => { currentUser = null; document.getElementById('appRoot').style.display = 'none'; showAuth(); };
    }

    showAuth();
    setTimeout(() => { if(document.getElementById('sendBtn')) bindEvents(); }, 500);
</script>
</body>
</html>
