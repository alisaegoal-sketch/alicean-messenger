<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Alicean | Радужный мессенджер</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    body {
      background: radial-gradient(circle at 20% 30%, #1a0b2e, #0a0515);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    @keyframes rainbowBorder {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .app-container {
      max-width: 1300px;
      width: 100%;
      height: 90vh;
      background: rgba(22, 12, 38, 0.6);
      backdrop-filter: blur(16px);
      border-radius: 42px;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .app-container::before {
      content: '';
      position: absolute;
      top: -6px;
      left: -6px;
      right: -6px;
      bottom: -6px;
      background: linear-gradient(135deg, #ff0a54, #ff477e, #ff9f4a, #ffd166, #6a4eff, #c77dff, #ff0a54);
      background-size: 300% 300%;
      border-radius: 48px;
      z-index: -2;
      opacity: 0.8;
      filter: blur(14px);
      animation: rainbowBorder 4s ease infinite;
    }

    .main-layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .chats-sidebar {
      width: 300px;
      background: rgba(12, 6, 25, 0.7);
      backdrop-filter: blur(12px);
      border-right: 1px solid rgba(255, 210, 210, 0.2);
      display: flex;
      flex-direction: column;
    }

    .user-profile {
      padding: 20px;
      background: linear-gradient(115deg, #2a1a4a80, #1f103f80);
      border-bottom: 2px solid #ff8cae40;
      cursor: pointer;
      transition: 0.2s;
    }
    .user-profile:hover { background: #3a2a5a80; }

    .profile-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .profile-avatar {
      width: 52px;
      height: 52px;
      background: linear-gradient(145deg, #ffb347, #ff6b9d);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-size: 28px;
    }
    .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .profile-info h3 { color: white; font-size: 1rem; }
    .profile-info p { font-size: 0.65rem; color: #f3c6ff; }

    .search-section {
      padding: 12px;
      border-bottom: 1px solid rgba(255,200,200,0.2);
      position: relative;
    }
    .search-input {
      width: 100%;
      padding: 10px 15px;
      background: #2a1b46;
      border: 1px solid #ffaa6640;
      border-radius: 40px;
      color: white;
      outline: none;
    }

    .chats-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    .chat-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px;
      margin-bottom: 6px;
      background: rgba(255,255,210,0.05);
      border-radius: 24px;
      cursor: pointer;
      transition: 0.2s;
    }
    .chat-item.active { background: linear-gradient(95deg, #b259ff40, #ff77aa40); border-left: 4px solid #ffb86b; }
    .chat-avatar { width: 44px; height: 44px; border-radius: 32px; background: radial-gradient(#ffbc6e, #ff6f91); display: flex; align-items: center; justify-content: center; font-size: 22px; }
    .chat-details { flex: 1; }
    .chat-name { font-weight: bold; color: #fff0e0; }
    .last-msg { font-size: 0.65rem; color: #ceb5ff; }

    button {
      margin: 6px 12px;
      background: linear-gradient(90deg, #ff6a8a, #b1549b);
      border: none;
      padding: 8px 16px;
      border-radius: 40px;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: rgba(0,0,0,0.2);
    }
    .chat-header-area {
      padding: 14px 20px;
      background: rgba(30, 18, 55, 0.7);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #ffb47b40;
      flex-wrap: wrap;
      gap: 10px;
    }
    .encryption-status {
      font-size: 0.7rem;
      padding: 4px 12px;
      border-radius: 20px;
      background: #00ff9d20;
      color: #00ff9d;
    }
    .header-buttons { display: flex; gap: 8px; }
    .settings-btn { background: #7b5ea7; }

    .messages-view {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .message {
      display: flex;
      max-width: 75%;
    }
    .message.incoming { align-self: flex-start; }
    .message.outgoing { align-self: flex-end; flex-direction: row-reverse; }
    .bubble {
      padding: 10px 16px;
      border-radius: 26px;
      background: #2d1f49dd;
      color: #f2eaff;
      word-break: break-word;
    }
    .outgoing .bubble {
      background: linear-gradient(125deg, #8f6be0, #bc6f9c);
    }
    .msg-time { font-size: 0.6rem; margin-top: 4px; color: #cbb3ff; text-align: right; }

    .input-message {
      padding: 14px 20px;
      background: #1e1135cc;
      display: flex;
      gap: 12px;
    }
    .msg-input-field {
      flex: 1;
      background: #2b1d46;
      border-radius: 60px;
      padding: 12px 18px;
      color: white;
      outline: none;
      border: 1px solid #ffaa8840;
    }
    .send-msg-btn {
      background: linear-gradient(145deg, #ff7e9e, #d46cb3);
      border: none;
      width: 48px;
      border-radius: 60px;
      cursor: pointer;
      font-size: 24px;
      color: white;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.95);
      backdrop-filter: blur(12px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2000;
    }
    .modal-card {
      width: 400px;
      max-width: 90%;
      background: #231b3c;
      border-radius: 48px;
      padding: 32px;
      border: 1px solid #ffbd9f;
    }
    .modal-card h2 { color: white; text-align: center; margin-bottom: 20px; }
    .modal-card input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      background: #2f224b;
      border: none;
      border-radius: 60px;
      color: white;
    }
    .error-msg { color: #ff8888; text-align: center; margin-top: 10px; }
    .success-msg { color: #88ff88; text-align: center; margin-top: 10px; }
    .avatar-preview {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(145deg, #ffb347, #ff6b9d);
      margin: 10px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      cursor: pointer;
      overflow: hidden;
    }
    .emoji-grid {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin: 12px 0;
    }
    .emoji-option {
      font-size: 32px;
      cursor: pointer;
      padding: 5px;
      border-radius: 50%;
      background: #2f1f4a;
      transition: 0.2s;
    }
    .emoji-option:hover { background: #ffaa6640; transform: scale(1.1); }
    .search-results {
      position: absolute;
      background: #1e1135;
      border-radius: 20px;
      width: calc(100% - 24px);
      max-height: 200px;
      overflow-y: auto;
      z-index: 100;
      top: 50px;
      left: 12px;
    }
    .search-result {
      padding: 10px;
      cursor: pointer;
      color: white;
      border-bottom: 1px solid #ffaa8820;
    }
    .search-result:hover { background: #ff77aa30; }
    .empty-chat { color: #b39eff; text-align: center; margin-top: 50px; }
  </style>
</head>
<body>
<div class="app-container" id="appRoot" style="display: none;">
  <div class="main-layout">
    <div class="chats-sidebar">
      <div class="user-profile" id="profileBtn">
        <div class="profile-row">
          <div class="profile-avatar" id="globalAvatar">🌈</div>
          <div class="profile-info">
            <h3 id="profileName"></h3>
            <p id="profileContact"></p>
          </div>
        </div>
      </div>
      <div class="search-section">
        <input type="text" class="search-input" id="searchInput" placeholder="🔍 Найти пользователя по имени, телефону или email">
        <div id="searchResults" class="search-results" style="display: none;"></div>
      </div>
      <div class="chats-list" id="chatsList"></div>
      <button id="createChannelBtn">📢 Создать канал</button>
      <button id="logoutBtn" style="background:#e63946;">🚪 Выйти</button>
    </div>
    <div class="chat-area">
      <div class="chat-header-area">
        <span id="currentChatTitle" style="font-weight:bold;">Выберите чат</span>
        <div class="header-buttons">
          <span class="encryption-status">🔒 E2EE</span>
          <button class="settings-btn" id="settingsBtn">⚙️ Профиль</button>
        </div>
      </div>
      <div class="messages-view" id="messagesArea"><div class="empty-chat">🌈 Добро пожаловать в Alicean!</div></div>
      <div class="input-message">
        <input type="text" class="msg-input-field" id="msgInput" placeholder="Сообщение...">
        <button class="send-msg-btn" id="sendBtn">➤</button>
      </div>
    </div>
  </div>
</div>

<script>
  // ДАННЫЕ
  let currentUser = null;
  let chats = [];
  let activeChat = null;
  let allUsers = [];

  function loadAllUsers() {
    allUsers = [];
    for(let i = 0; i < localStorage.length; i++) {
      let key = localStorage.key(i);
      if(key && key.startsWith('alicean_user_')) {
        let data = JSON.parse(localStorage.getItem(key));
        if(data.user && (!currentUser || data.user.id !== currentUser.id)) {
          allUsers.push(data.user);
        }
      }
    }
  }

  function saveData() {
    if(currentUser) {
      localStorage.setItem(`alicean_user_${currentUser.id}`, JSON.stringify({
        user: currentUser,
        chats: chats
      }));
      loadAllUsers();
    }
  }

  // РЕГИСТРАЦИЯ
  function register(name, phone, email, pass) {
    if(!name || !phone || !email || !pass) return "Заполните все поля!";
    for(let i = 0; i < localStorage.length; i++) {
      let key = localStorage.key(i);
      if(key && key.startsWith('alicean_user_')) {
        let data = JSON.parse(localStorage.getItem(key));
        if(data.user.phone === phone) return "Телефон уже зарегистрирован";
        if(data.user.email === email) return "Email уже зарегистрирован";
      }
    }
    let id = Date.now() + "_" + Math.random().toString(36).substr(2, 8);
    currentUser = {
      id: id,
      name: name,
      phone: phone,
      email: email,
      password: pass,
      avatarType: 'emoji',
      avatarData: '🌈'
    };
    chats = [{
      id: "welcome_" + Date.now(),
      name: "🌈 Добро пожаловать!",
      type: "channel",
      messages: [{ text: `✨ Добро пожаловать, ${name}!`, sender: "system", time: new Date().toLocaleTimeString() }]
    }];
    saveData();
    return "ok";
  }

  function login(identifier, pass) {
    for(let i = 0; i < localStorage.length; i++) {
      let key = localStorage.key(i);
      if(key && key.startsWith('alicean_user_')) {
        let data = JSON.parse(localStorage.getItem(key));
        let u = data.user;
        if((u.phone === identifier || u.email === identifier || u.name === identifier) && u.password === pass) {
          currentUser = u;
          chats = data.chats || [];
          saveData();
          return true;
        }
      }
    }
    return false;
  }

  // ЧАТЫ
  function createPrivateChat(otherUser) {
    let existing = chats.find(c => c.type === 'private' && c.participants && c.participants.includes(currentUser.id) && c.participants.includes(otherUser.id));
    if(existing) { openChat(existing.id); return; }
    let chatId = "private_" + Date.now() + "_" + Math.random().toString(36).substr(2, 6);
    let newChat = {
      id: chatId,
      name: otherUser.name,
      type: "private",
      participants: [currentUser.id, otherUser.id],
      messages: [{ text: `🔒 Чат с ${otherUser.name} защищён.`, sender: "system", time: new Date().toLocaleTimeString() }]
    };
    chats.push(newChat);
    saveData();
    renderChats();
    openChat(chatId);
  }

  function createChannel(name) {
    let chatId = "channel_" + Date.now() + "_" + Math.random().toString(36).substr(2, 6);
    let newChat = {
      id: chatId,
      name: name,
      type: "channel",
      messages: [{ text: `✨ Канал "${name}" создан!`, sender: "system", time: new Date().toLocaleTimeString() }]
    };
    chats.push(newChat);
    saveData();
    renderChats();
    openChat(chatId);
  }

  function openChat(chatId) {
    let chat = chats.find(c => c.id === chatId);
    if(!chat) return;
    activeChat = chatId;
    document.getElementById('currentChatTitle').innerHTML = chat.name;
    renderMessages(chat);
    renderChats();
  }

  function renderMessages(chat) {
    let container = document.getElementById('messagesArea');
    if(!chat.messages || chat.messages.length === 0) {
      container.innerHTML = '<div class="empty-chat">💬 Напишите первое сообщение</div>';
      return;
    }
    container.innerHTML = '';
    chat.messages.forEach(msg => {
      let isOut = msg.sender === currentUser?.name;
      let div = document.createElement('div');
      div.className = `message ${isOut ? 'outgoing' : 'incoming'}`;
      div.innerHTML = `<div class="bubble">${escapeHtml(msg.text)}</div><div class="msg-time">${msg.time} · ${msg.sender !== 'system' ? msg.sender : ''}</div>`;
      container.appendChild(div);
    });
    container.scrollTop = container.scrollHeight;
  }

  function addMessage(chatId, text) {
    let chat = chats.find(c => c.id === chatId);
    if(chat) {
      chat.messages.push({ text: text, sender: currentUser.name, time: new Date().toLocaleTimeString() });
      saveData();
      if(activeChat === chatId) renderMessages(chat);
      renderChats();
    }
  }

  function renderChats() {
    let container = document.getElementById('chatsList');
    if(!chats.length) { container.innerHTML = '<div style="padding:16px; color:#aaa;">Нет чатов</div>'; return; }
    container.innerHTML = '';
    chats.forEach(chat => {
      let lastMsg = chat.messages && chat.messages.length ? chat.messages[chat.messages.length-1].text.substring(0, 30) : "Новый чат";
      let div = document.createElement('div');
      div.className = `chat-item ${activeChat === chat.id ? 'active' : ''}`;
      div.innerHTML = `<div class="chat-avatar">${chat.type === 'channel' ? '📢' : '💬'}</div><div class="chat-details"><div class="chat-name">${escapeHtml(chat.name)}</div><div class="last-msg">${escapeHtml(lastMsg)}</div></div>`;
      div.onclick = () => openChat(chat.id);
      container.appendChild(div);
    });
  }

  function updateUI() {
    document.getElementById('profileName').innerText = currentUser.name;
    document.getElementById('profileContact').innerHTML = `📞 ${currentUser.phone}`;
    let avatar = document.getElementById('globalAvatar');
    avatar.innerHTML = '';
    if(currentUser.avatarType === 'image' && currentUser.avatarData) {
      let img = document.createElement('img');
      img.src = currentUser.avatarData;
      avatar.appendChild(img);
    } else {
      avatar.innerText = currentUser.avatarData || '🌈';
    }
    renderChats();
    if(chats.length) openChat(chats[0].id);
  }

  // НАСТРОЙКИ СМЕНЫ АВАТАРА
  function showSettings() {
    let modal = document.createElement('div');
    modal.className = 'modal-overlay';
    modal.innerHTML = `
      <div class="modal-card">
        <h2>⚙️ Настройки профиля</h2>
        <div class="avatar-preview" id="settingsAvatar">${currentUser.avatarType === 'image' ? `<img src="${currentUser.avatarData}">` : currentUser.avatarData}</div>
        <div class="emoji-grid" id="emojiGrid"></div>
        <button id="uploadBtn">📸 Загрузить фото</button>
        <input type="file" id="fileInput" accept="image/*" style="display:none;">
        <input type="text" id="settingsName" placeholder="Имя" value="${escapeHtml(currentUser.name)}">
        <input type="tel" id="settingsPhone" placeholder="Телефон" value="${escapeHtml(currentUser.phone)}">
        <input type="email" id="settingsEmail" placeholder="Email" value="${escapeHtml(currentUser.email)}">
        <input type="password" id="settingsPass" placeholder="Новый пароль">
        <div id="settingsMsg"></div>
        <button id="saveSettings">💾 Сохранить</button>
        <button id="closeSettings" style="background:#5a4a7a;">Закрыть</button>
      </div>
    `;
    document.body.appendChild(modal);
    
    let emojis = ['🌈', '🌟', '🦄', '🎨', '💖', '✨', '🌸', '🐱', '⭐', '💎', '🔥', '💜', '😎', '🤖'];
    let grid = document.getElementById('emojiGrid');
    emojis.forEach(emo => {
      let span = document.createElement('span');
      span.className = 'emoji-option';
      span.innerText = emo;
      span.onclick = () => {
        currentUser.avatarType = 'emoji';
        currentUser.avatarData = emo;
        document.getElementById('settingsAvatar').innerHTML = emo;
        updateUI();
        document.getElementById('settingsMsg').innerHTML = '<span class="success-msg">✅ Аватар изменён! Сохраните.</span>';
      };
      grid.appendChild(span);
    });
    
    document.getElementById('uploadBtn').onclick = () => document.getElementById('fileInput').click();
    document.getElementById('fileInput').onchange = (e) => {
      let file = e.target.files[0];
      if(file && file.type.startsWith('image/')) {
        if(file.size > 5 * 1024 * 1024) {
          document.getElementById('settingsMsg').innerHTML = '<span class="error-msg">❌ Файл больше 5MB</span>';
          return;
        }
        let reader = new FileReader();
        reader.onload = (ev) => {
          currentUser.avatarType = 'image';
          currentUser.avatarData = ev.target.result;
          document.getElementById('settingsAvatar').innerHTML = `<img src="${ev.target.result}">`;
          updateUI();
          document.getElementById('settingsMsg').innerHTML = '<span class="success-msg">✅ Фото загружено! Сохраните.</span>';
        };
        reader.readAsDataURL(file);
      }
    };
    
    document.getElementById('saveSettings').onclick = () => {
      let newName = document.getElementById('settingsName').value.trim();
      let newPhone = document.getElementById('settingsPhone').value.trim();
      let newEmail = document.getElementById('settingsEmail').value.trim();
      let newPass = document.getElementById('settingsPass').value.trim();
      if(newName) currentUser.name = newName;
      if(newPhone) currentUser.phone = newPhone;
      if(newEmail) currentUser.email = newEmail;
      if(newPass) currentUser.password = newPass;
      saveData();
      updateUI();
      document.getElementById('settingsMsg').innerHTML = '<span class="success-msg">✅ Сохранено!</span>';
      setTimeout(() => modal.remove(), 1200);
    };
    document.getElementById('closeSettings').onclick = () => modal.remove();
  }

  // ПОИСК КОНТАКТОВ
  function setupSearch() {
    let searchInput = document.getElementById('searchInput');
    let resultsDiv = document.getElementById('searchResults');
    
    searchInput.addEventListener('input', () => {
      let query = searchInput.value.toLowerCase().trim();
      if(query.length === 0) {
        resultsDiv.style.display = 'none';
        return;
      }
      let results = allUsers.filter(u => 
        u.name.toLowerCase().includes(query) || 
        u.phone.includes(query) || 
        u.email.toLowerCase().includes(query)
      );
      if(results.length > 0) {
        resultsDiv.style.display = 'block';
        resultsDiv.innerHTML = results.map(u => `
          <div class="search-result" data-id="${u.id}">
            ${u.avatarData || '👤'} <strong>${escapeHtml(u.name)}</strong><br>
            <small style="font-size:11px;">📞 ${u.phone} | ✉️ ${u.email}</small>
          </div>
        `).join('');
        document.querySelectorAll('.search-result').forEach(el => {
          el.onclick = () => {
            let user = allUsers.find(u => u.id === el.dataset.id);
            if(user) {
              createPrivateChat(user);
              searchInput.value = '';
              resultsDiv.style.display = 'none';
            }
          };
        });
      } else {
        resultsDiv.style.display = 'block';
        resultsDiv.innerHTML = '<div style="padding:10px; color:#aaa;">👤 Пользователи не найдены</div>';
      }
    });
    
    document.addEventListener('click', (e) => {
      if(!searchInput.contains(e.target) && !resultsDiv.contains(e.target)) {
        resultsDiv.style.display = 'none';
      }
    });
  }

  // АВТОРИЗАЦИЯ
  function showAuth() {
    let modal = document.createElement('div');
    modal.className = 'modal-overlay';
    let isLogin = false;
    function render() {
      if(isLogin) {
        modal.innerHTML = `<div class="modal-card"><h2>🔐 Вход</h2><input type="text" id="loginId" placeholder="Телефон / Email / Имя"><input type="password" id="loginPass" placeholder="Пароль"><div id="authMsg" class="error-msg"></div><button id="submitBtn">Войти</button><button id="toggleBtn" style="background:#5a4a7a;">✨ Создать аккаунт</button></div>`;
      } else {
        modal.innerHTML = `<div class="modal-card"><h2>🌈 Регистрация</h2><input type="text" id="regName" placeholder="Имя"><input type="tel" id="regPhone" placeholder="Телефон"><input type="email" id="regEmail" placeholder="Email"><input type="password" id="regPass" placeholder="Пароль"><div id="authMsg" class="error-msg"></div><button id="submitBtn">Зарегистрироваться</button><button id="toggleBtn" style="background:#5a4a7a;">🔐 Уже есть аккаунт?</button></div>`;
      }
      document.getElementById('submitBtn').onclick = () => {
        let msg = document.getElementById('authMsg');
        if(isLogin) {
          let id = document.getElementById('loginId').value.trim();
          let pass = document.getElementById('loginPass').value.trim();
          if(!id || !pass) { msg.innerText = "Заполните поля"; return; }
          if(login(id, pass)) {
            modal.remove();
            document.getElementById('appRoot').style.display = 'flex';
            updateUI();
            setupSearch();
          } else msg.innerText = "Неверные данные";
        } else {
          let name = document.getElementById('regName').value.trim();
          let phone = document.getElementById('regPhone').value.trim();
          let email = document.getElementById('regEmail').value.trim();
          let pass = document.getElementById('regPass').value.trim();
          let res = register(name, phone, email, pass);
          if(res === "ok") {
            msg.style.color = '#88ff88';
            msg.innerText = "✅ Аккаунт создан! Вход...";
            setTimeout(() => {
              modal.remove();
              document.getElementById('appRoot').style.display = 'flex';
              updateUI();
              setupSearch();
            }, 1000);
          } else msg.innerText = res;
        }
      };
      document.getElementById('toggleBtn').onclick = () => { isLogin = !isLogin; render(); };
    }
    render();
    document.body.appendChild(modal);
  }

  function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m])); }

  // ЗАПУСК
  document.getElementById('sendBtn')?.addEventListener('click', () => {
    let input = document.getElementById('msgInput');
    if(activeChat && input.value.trim()) {
      addMessage(activeChat, input.value.trim());
      input.value = '';
    }
  });
  document.getElementById('msgInput')?.addEventListener('keypress', (e) => { if(e.key === 'Enter') document.getElementById('sendBtn').click(); });
  document.getElementById('createChannelBtn')?.addEventListener('click', () => {
    let name = prompt("Название канала:");
    if(name && name.trim()) createChannel(name);
  });
  document.getElementById('logoutBtn')?.addEventListener('click', () => {
    currentUser = null;
    document.getElementById('appRoot').style.display = 'none';
    showAuth();
  });
  document.getElementById('settingsBtn')?.addEventListener('click', showSettings);
  document.getElementById('profileBtn')?.addEventListener('click', showSettings);
  
  showAuth();
</script>
</body>
</html>
