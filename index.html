<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Alicean | Облачный мессенджер</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', sans-serif;
        }
        body {
            background: radial-gradient(circle at 20% 30%, #1a0b2e, #0a0515);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        @keyframes rainbow {
            0% { border-color: #ff0a54; box-shadow: 0 0 5px #ff0a54; }
            50% { border-color: #6a4eff; box-shadow: 0 0 20px #6a4eff; }
            100% { border-color: #ff0a54; box-shadow: 0 0 5px #ff0a54; }
        }
        .auth-box, .chat-container {
            width: 100%;
            max-width: 800px;
            background: rgba(30, 20, 50, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 30px;
            border: 2px solid #ff77aa;
            animation: rainbow 2s infinite;
        }
        .chat-container {
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 90vh;
            overflow: hidden;
        }
        h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 32px;
            background: linear-gradient(90deg, #ff0a54, #ff9f4a, #ffd166, #6a4eff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .sub { text-align: center; color: #b0a0d0; margin-bottom: 25px; }
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background: #2a1a3e;
            border: 1px solid #8a6ab0;
            border-radius: 30px;
            color: white;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, #ff6a8a, #c55cff);
            border: none;
            border-radius: 30px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-top: 12px;
        }
        .btn-outline { background: transparent; border: 1px solid #ff77aa; }
        .msg { text-align: center; margin-top: 12px; padding: 8px; border-radius: 15px; font-size: 12px; }
        .error { background: #ff4444; color: white; }
        .success { background: #44aa44; color: white; }
        .hidden { display: none; }
        .chat-header { padding: 15px; background: #1f103f; color: white; text-align: center; border-bottom: 1px solid #ff77aa; }
        .messages { flex: 1; overflow-y: auto; padding: 15px; }
        .my-msg { text-align: right; margin: 8px 0; }
        .my-msg .bubble { background: #ff6a8a; display: inline-block; padding: 8px 15px; border-radius: 18px; max-width: 70%; }
        .other-msg { text-align: left; margin: 8px 0; }
        .other-msg .bubble { background: #3a2a5a; display: inline-block; padding: 8px 15px; border-radius: 18px; max-width: 70%; }
        .time { font-size: 9px; opacity: 0.6; margin-top: 3px; }
        .input-row { padding: 12px; display: flex; gap: 8px; border-top: 1px solid #ff77aa; background: #1f103f; }
        .input-row input { flex: 1; margin: 0; }
        .input-row button { width: auto; margin: 0; padding: 12px 20px; }
        .profile-row { display: flex; justify-content: space-between; align-items: center; background: #1f103f; padding: 10px 15px; border-bottom: 1px solid #ff77aa; }
        .profile-name { color: white; font-weight: bold; }
        .logout-btn { background: #e63946; width: auto; padding: 6px 15px; margin: 0; font-size: 12px; }
        .online-section { padding: 10px; border-bottom: 1px solid #ff77aa; }
        .online-title { color: #88ff88; font-size: 11px; margin-bottom: 8px; text-align: center; }
        .online-list { max-height: 120px; overflow-y: auto; }
        .online-item { padding: 5px 8px; background: #2a1a3e; border-radius: 15px; margin-bottom: 5px; font-size: 11px; color: white; display: flex; align-items: center; gap: 6px; }
        .online-dot { width: 8px; height: 8px; background: #44ff44; border-radius: 50%; display: inline-block; }
    </style>
</head>
<body>

<div id="authPage" class="auth-box">
    <h1>🌈 Alicean</h1>
    <p class="sub">🔒 Облачный мессенджер</p>
    <div id="loginPanel">
        <input type="text" id="loginId" placeholder="Телефон или Email">
        <input type="password" id="loginPass" placeholder="Пароль">
        <div id="loginMsg" class="msg hidden"></div>
        <button id="loginBtn">🔐 Войти</button>
        <button id="toRegBtn" class="btn-outline">✨ Создать аккаунт</button>
    </div>
    <div id="regPanel" class="hidden">
        <input type="text" id="regName" placeholder="Имя">
        <input type="tel" id="regPhone" placeholder="Телефон">
        <input type="email" id="regEmail" placeholder="Email">
        <input type="password" id="regPass" placeholder="Пароль">
        <div id="regMsg" class="msg hidden"></div>
        <button id="regBtn">📝 Зарегистрироваться</button>
        <button id="toLoginBtn" class="btn-outline">🔐 Уже есть аккаунт?</button>
    </div>
</div>

<div id="chatPage" style="display: none;">
    <div class="chat-container">
        <div class="profile-row">
            <div class="profile-name" id="userName"></div>
            <button id="logoutBtn" class="logout-btn">🚪 Выйти</button>
        </div>
        <div class="online-section">
            <div class="online-title">🟢 Онлайн</div>
            <div class="online-list" id="onlineList"></div>
        </div>
        <div class="chat-header">💬 ОБЩИЙ ЧАТ</div>
        <div class="messages" id="msgList"></div>
        <div class="input-row">
            <input type="text" id="msgField" placeholder="Сообщение...">
            <button id="sendMsgBtn">➤</button>
        </div>
    </div>
</div>

<script>
    // ========== ВСТАВЬ СВОИ ДАННЫЕ ИЗ SUPABASE ==========
    const SUPABASE_URL = "https://ckjrgteguolamnwcs.supabase.co";   // ТВОЙ URL
    const SUPABASE_KEY = "sb_publishable_abv4q3bMffRUq69BovDqrg_F_ri_lA-"
    
    let currentUser = null;
    let allUsers = [];
    
    async function request(endpoint, method, body) {
        try {
            let response = await fetch(SUPABASE_URL + endpoint, {
                method: method,
                headers: {
                    "Content-Type": "application/json",
                    "apikey": SUPABASE_KEY,
                    "Authorization": "Bearer " + SUPABASE_KEY
                },
                body: body ? JSON.stringify(body) : undefined
            });
            return await response.json();
        } catch(e) {
            console.error("Ошибка:", e);
            return null;
        }
    }
    
    async function registerUser(name, phone, email, pass) {
        if(!name || !phone || !email || !pass) return 'Заполните поля!';
        let existing = await request("/rest/v1/users?phone=eq." + phone, "GET");
        if(existing && existing.length > 0) return 'Телефон занят!';
        let existingEmail = await request("/rest/v1/users?email=eq." + email, "GET");
        if(existingEmail && existingEmail.length > 0) return 'Email занят!';
        let result = await request("/rest/v1/users", "POST", {
            name: name, phone: phone, email: email, password: pass, avatar: '🌈'
        });
        if(result && result.id) { currentUser = result; return 'ok'; }
        return 'Ошибка сервера';
    }
    
    async function loginUser(identifier, pass) {
        let byPhone = await request("/rest/v1/users?phone=eq." + identifier, "GET");
        if(byPhone && byPhone.length > 0 && byPhone[0].password === pass) {
            currentUser = byPhone[0];
            return true;
        }
        let byEmail = await request("/rest/v1/users?email=eq." + identifier, "GET");
        if(byEmail && byEmail.length > 0 && byEmail[0].password === pass) {
            currentUser = byEmail[0];
            return true;
        }
        return false;
    }
    
    async function loadMessages() {
        let result = await request("/rest/v1/messages?order=id.asc&limit=200", "GET");
        return result || [];
    }
    
    async function saveMessage(text, sender) {
        await request("/rest/v1/messages", "POST", {
            text: text, sender: sender, time: new Date().toLocaleTimeString()
        });
    }
    
    async function loadAllUsers() {
        let result = await request("/rest/v1/users?select=id,name,avatar", "GET");
        allUsers = result || [];
        renderOnlineList();
    }
    
    function renderOnlineList() {
        let container = document.getElementById('onlineList');
        let others = allUsers.filter(u => u.id !== currentUser?.id);
        if(!others.length) {
            container.innerHTML = '<div style="color:#aaa; text-align:center; padding:5px;">👤 Других пользователей нет</div>';
            return;
        }
        container.innerHTML = '';
        for(let i = 0; i < others.length; i++) {
            let div = document.createElement('div');
            div.className = 'online-item';
            div.innerHTML = '<span class="online-dot"></span><span>' + (others[i].avatar || '👤') + ' ' + others[i].name + '</span>';
            container.appendChild(div);
        }
    }
    
    async function renderMessages() {
        let container = document.getElementById('msgList');
        let msgs = await loadMessages();
        if(!msgs.length) {
            container.innerHTML = '<div style="color:#aaa; text-align:center; padding:20px;">💬 Нет сообщений</div>';
            return;
        }
        container.innerHTML = '';
        for(let i = 0; i < msgs.length; i++) {
            let msg = msgs[i];
            let isMy = (currentUser && msg.sender === currentUser.name);
            let div = document.createElement('div');
            div.className = isMy ? 'my-msg' : 'other-msg';
            div.innerHTML = '<div class="bubble"><b>' + msg.sender + '</b><br>' + msg.text + '<div class="time">' + msg.time + ' 🔒</div></div>';
            container.appendChild(div);
        }
        container.scrollTop = container.scrollHeight;
    }
    
    async function startChat() {
        document.getElementById('authPage').style.display = 'none';
        document.getElementById('chatPage').style.display = 'block';
        document.getElementById('userName').innerHTML = '👤 ' + currentUser.name;
        await loadAllUsers();
        await renderMessages();
        setInterval(async () => { if(currentUser) { await loadAllUsers(); await renderMessages(); } }, 3000);
    }
    
    document.getElementById('loginBtn').onclick = async () => {
        let id = document.getElementById('loginId').value.trim();
        let pass = document.getElementById('loginPass').value.trim();
        let msgDiv = document.getElementById('loginMsg');
        if(!id || !pass) { msgDiv.classList.remove('hidden'); msgDiv.className = 'msg error'; msgDiv.innerText = 'Заполните поля!'; return; }
        if(await loginUser(id, pass)) { startChat(); }
        else { msgDiv.classList.remove('hidden'); msgDiv.className = 'msg error'; msgDiv.innerText = 'Неверные данные!'; }
    };
    
    document.getElementById('regBtn').onclick = async () => {
        let name = document.getElementById('regName').value.trim();
        let phone = document.getElementById('regPhone').value.trim();
        let email = document.getElementById('regEmail').value.trim();
        let pass = document.getElementById('regPass').value.trim();
        let msgDiv = document.getElementById('regMsg');
        let res = await registerUser(name, phone, email, pass);
        if(res === 'ok') {
            msgDiv.classList.remove('hidden'); msgDiv.className = 'msg success'; msgDiv.innerText = '✅ Аккаунт создан!';
            setTimeout(() => startChat(), 1500);
        } else {
            msgDiv.classList.remove('hidden'); msgDiv.className = 'msg error'; msgDiv.innerText = res;
        }
    };
    
    document.getElementById('toRegBtn').onclick = () => {
        document.getElementById('loginPanel').classList.add('hidden');
        document.getElementById('regPanel').classList.remove('hidden');
    };
    document.getElementById('toLoginBtn').onclick = () => {
        document.getElementById('regPanel').classList.add('hidden');
        document.getElementById('loginPanel').classList.remove('hidden');
    };
    
    document.getElementById('sendMsgBtn').onclick = async () => {
        let input = document.getElementById('msgField');
        if(input.value.trim() && currentUser) {
            await saveMessage(input.value.trim(), currentUser.name);
            input.value = '';
            await renderMessages();
        }
    };
    document.getElementById('msgField').addEventListener('keypress', (e) => {
        if(e.key === 'Enter') document.getElementById('sendMsgBtn').click();
    });
    
    document.getElementById('logoutBtn').onclick = () => {
        currentUser = null;
        document.getElementById('chatPage').style.display = 'none';
        document.getElementById('authPage').style.display = 'block';
        document.getElementById('loginPanel').classList.remove('hidden');
        document.getElementById('regPanel').classList.add('hidden');
    };
</script>
</body>
</html>
