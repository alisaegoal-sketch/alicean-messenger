<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alicean | Общий чат</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
        body { background: radial-gradient(circle at 20% 30%, #1a0b2e, #0a0515); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 10px; }
        @keyframes rainbow { 0% { border-color: #ff0a54; } 50% { border-color: #6a4eff; } 100% { border-color: #ff0a54; } }
        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background: rgba(30, 20, 50, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            display: flex;
            flex-direction: column;
            border: 2px solid #ff77aa;
            animation: rainbow 2s infinite;
            overflow: hidden;
        }
        .chat-header {
            padding: 15px;
            background: #1f103f;
            color: white;
            font-weight: bold;
            text-align: center;
            border-bottom: 1px solid #ff77aa;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }
        .my-msg { text-align: right; margin: 8px 0; }
        .my-msg .bubble { background: #ff6a8a; display: inline-block; padding: 8px 15px; border-radius: 18px; max-width: 70%; }
        .other-msg { text-align: left; margin: 8px 0; }
        .other-msg .bubble { background: #3a2a5a; display: inline-block; padding: 8px 15px; border-radius: 18px; max-width: 70%; }
        .time { font-size: 9px; opacity: 0.6; margin-top: 3px; }
        .input-row {
            padding: 12px;
            display: flex;
            gap: 8px;
            border-top: 1px solid #ff77aa;
            background: #1f103f;
        }
        .input-row input { flex: 1; background: #2a1a3e; border: 1px solid #ff77aa; border-radius: 25px; padding: 12px; color: white; }
        .input-row button { background: linear-gradient(90deg, #ff6a8a, #c55cff); border: none; border-radius: 25px; padding: 12px 20px; color: white; cursor: pointer; }
        .name-input {
            display: flex;
            gap: 8px;
            padding: 10px;
            background: #1f103f;
            border-bottom: 1px solid #ff77aa;
        }
        .name-input input { flex: 1; background: #2a1a3e; border: 1px solid #ff77aa; border-radius: 25px; padding: 10px; color: white; }
        .name-input button { width: auto; padding: 10px 20px; margin: 0; }
    </style>
</head>
<body>
<div class="chat-container">
    <div class="chat-header">
        🌈 Alicean — ОБЩИЙ ЧАТ
    </div>
    <div class="name-input">
        <input type="text" id="userNameInput" placeholder="Ваше имя">
        <button id="joinBtn">Войти в чат</button>
    </div>
    <div class="messages" id="messagesList">
        <div style="color:#aaa; text-align:center; padding:20px;">👋 Введите имя и присоединяйтесь</div>
    </div>
    <div class="input-row">
        <input type="text" id="msgInput" placeholder="Сообщение..." disabled>
        <button id="sendBtn" disabled>➤</button>
    </div>
</div>

<script>
    let userName = null;
    
    function loadMessages() {
        let messages = localStorage.getItem('alicean_messages');
        if(messages) {
            return JSON.parse(messages);
        }
        return [];
    }
    
    function saveMessages(messages) {
        localStorage.setItem('alicean_messages', JSON.stringify(messages));
    }
    
    function addMessage(text, sender) {
        let messages = loadMessages();
        messages.push({
            text: text,
            sender: sender,
            time: new Date().toLocaleTimeString()
        });
        saveMessages(messages);
        renderMessages();
    }
    
    function renderMessages() {
        let container = document.getElementById('messagesList');
        let messages = loadMessages();
        if(messages.length === 0) {
            container.innerHTML = '<div style="color:#aaa; text-align:center; padding:20px;">💬 Нет сообщений. Напишите первое!</div>';
            return;
        }
        container.innerHTML = '';
        for(let i = 0; i < messages.length; i++) {
            let msg = messages[i];
            let isMy = (msg.sender === userName);
            let div = document.createElement('div');
            div.className = isMy ? 'my-msg' : 'other-msg';
            div.innerHTML = '<div class="bubble"><b>' + msg.sender + '</b><br>' + msg.text + '<div class="time">' + msg.time + '</div></div>';
            container.appendChild(div);
        }
        container.scrollTop = container.scrollHeight;
    }
    
    function startChat() {
        userName = document.getElementById('userNameInput').value.trim();
        if(!userName) {
            alert('Введите имя!');
            return;
        }
        document.getElementById('userNameInput').disabled = true;
        document.getElementById('joinBtn').disabled = true;
        document.getElementById('msgInput').disabled = false;
        document.getElementById('sendBtn').disabled = false;
        document.getElementById('msgInput').focus();
        renderMessages();
        
        // Периодически проверяем новые сообщения
        setInterval(() => {
            renderMessages();
        }, 1000);
    }
    
    document.getElementById('joinBtn').onclick = startChat;
    document.getElementById('userNameInput').addEventListener('keypress', (e) => {
        if(e.key === 'Enter') startChat();
    });
    
    document.getElementById('sendBtn').onclick = () => {
        let msg = document.getElementById('msgInput').value.trim();
        if(msg && userName) {
            addMessage(msg, userName);
            document.getElementById('msgInput').value = '';
        }
    };
    document.getElementById('msgInput').addEventListener('keypress', (e) => {
        if(e.key === 'Enter') document.getElementById('sendBtn').click();
    });
</script>
</body>
</html>
