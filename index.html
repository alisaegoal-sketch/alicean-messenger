<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alicean | Радужный мессенджер 🌈</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', sans-serif;
        }
        body {
            background: radial-gradient(circle at 20% 30%, #1a0b2e, #0a0515);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        @keyframes rainbowBorder {
            0% { border-color: #ff0a54; box-shadow: 0 0 5px #ff0a54; }
            50% { border-color: #6a4eff; box-shadow: 0 0 20px #6a4eff; }
            100% { border-color: #ff0a54; box-shadow: 0 0 5px #ff0a54; }
        }
        @keyframes rainbowText {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }
        .auth-card {
            max-width: 450px;
            width: 100%;
            background: rgba(30, 20, 50, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 40px;
            border: 2px solid #ff0a54;
            animation: rainbowBorder 2s infinite;
        }
        h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 36px;
            background: linear-gradient(90deg, #ff0a54, #ff9f4a, #ffd166, #6a4eff);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: rainbowText 3s ease infinite;
        }
        .sub {
            text-align: center;
            color: #b0a0d0;
            margin-bottom: 30px;
        }
        input {
            width: 100%;
            padding: 14px 18px;
            margin: 10px 0;
            background: #2a1a3e;
            border: 1px solid #8a6ab0;
            border-radius: 30px;
            color: white;
            font-size: 16px;
            outline: none;
        }
        input:focus {
            border-color: #ff77aa;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #ff6a8a, #c55cff);
            border: none;
            border-radius: 30px;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid #ff77aa;
        }
        .msg {
            text-align: center;
            margin-top: 15px;
            padding: 10px;
            border-radius: 20px;
            font-size: 14px;
        }
        .error { background: #ff444420; color: #ff8888; }
        .success { background: #44ff4420; color: #88ff88; }
        .hidden { display: none; }
        
        /* Чат */
        .chat-container {
            display: flex;
            width: 1300px;
            max-width: 100%;
            height: 85vh;
            background: rgba(30, 20, 50, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            overflow: hidden;
            border: 2px solid #ff0a54;
            animation: rainbowBorder 2s infinite;
        }
        .sidebar {
            width: 280px;
            background: rgba(20, 10, 35, 0.8);
            padding: 20px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #3a2a5a;
        }
        .profile {
            color: white;
            padding-bottom: 20px;
            border-bottom: 1px solid #ff77aa;
            margin-bottom: 20px;
        }
        .profile-name {
            font-size: 18px;
            font-weight: bold;
        }
        .profile-phone {
            font-size: 12px;
            color: #b0a0d0;
            margin-top: 5px;
        }
        .chat-list {
            flex: 1;
            overflow-y: auto;
        }
        .chat-item {
            background: #2a1a3e;
            padding: 12px 15px;
            border-radius: 20px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: 0.2s;
        }
        .chat-item:hover {
            background: #3a2a4e;
        }
        .chat-item.active {
            background: linear-gradient(90deg, #ff6a8a, #c55cff);
        }
        .chat-name {
            font-weight: bold;
            color: white;
        }
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .chat-header {
            padding: 20px;
            background: #1f103f;
            color: white;
            font-weight: bold;
            font-size: 18px;
            border-bottom: 1px solid #ff77aa;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        .message {
            margin-bottom: 15px;
        }
        .message-mine {
            text-align: right;
        }
        .message-mine .bubble {
            background: linear-gradient(135deg, #c55cff, #ff6a8a);
            display: inline-block;
            padding: 10px 16px;
            border-radius: 20px;
            max-width: 70%;
            color: white;
        }
        .message-other {
            text-align: left;
        }
        .message-other .bubble {
            background: #2a1a3e;
            display: inline-block;
            padding: 10px 16px;
            border-radius: 20px;
            max-width: 70%;
            color: white;
        }
        .message-time {
            font-size: 10px;
            opacity: 0.6;
            margin-top: 4px;
        }
        .input-area {
            padding: 20px;
            display: flex;
            gap: 10px;
            border-top: 1px solid #ff77aa;
            background: #1f103f;
        }
        .input-area input {
            flex: 1;
            margin: 0;
        }
        .input-area button {
            width: auto;
            margin: 0;
            padding: 14px 25px;
        }
        .btn-logout {
            background: #e63946;
            margin-top: 20px;
        }
        .action-buttons {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        .action-buttons button {
            flex: 1;
            margin: 0;
            padding: 8px;
            font-size: 12px;
        }
    </style>
</head>
<body>

<!-- ЭКРАН ВХОДА -->
<div id="authScreen" class="auth-card">
    <h1>🌈 Alicean</h1>
    <p class="sub">🔒 Безопасный радужный мессенджер</p>
    
    <div id="loginBlock">
        <input type="text" id="loginId" placeholder="Телефон, Email или Имя">
        <input type="password" id="loginPass" placeholder="Пароль">
        <div id="loginError" class="msg hidden"></div>
        <button id="doLoginBtn">🔐 Войти</button>
        <button id="showRegBtn" class="btn-outline">✨ Создать аккаунт</button>
    </div>

    <div id="registerBlock" class="hidden">
        <input type="text" id="regName" placeholder="Имя пользователя">
        <input type="tel" id="regPhone" placeholder="Номер телефона">
        <input type="email" id="regEmail" placeholder="Email">
        <input type="password" id="regPass" placeholder="Пароль">
        <div id="regError" class="msg hidden"></div>
        <button id="doRegBtn">📝 Зарегистрироваться</button>
        <button id="showLoginBtn" class="btn-outline">🔐 Уже есть аккаунт?</button>
    </div>
</div>

<!-- ЭКРАН ЧАТА -->
<div id="chatScreen" class="hidden">
    <div class="chat-container">
        <div class="sidebar">
            <div class="profile">
                <div class="profile-name" id="profileName"></div>
                <div class="profile-phone" id="profilePhone"></div>
                <div class="action-buttons">
                    <button id="editProfileBtn">✏️ Редактировать</button>
                    <button id="callChatBtn">📞 Звонок</button>
                    <button id="giftChatBtn">🎁 Подарок</button>
                </div>
            </div>
            <div class="chat-list" id="chatList"></div>
            <button id="newChannelBtn">➕ Новый канал</button>
            <button id="premiumBtn">⭐ Premium</button>
            <button id="logoutChatBtn" class="btn-logout">🚪 Выйти</button>
        </div>
        <div class="main-chat">
            <div class="chat-header" id="currentChatTitle">Выберите чат</div>
            <div class="messages" id="messagesList">
                <div style="color: #aaa; text-align: center;">💬 Нажмите на чат слева</div>
            </div>
            <div class="input-area">
                <input type="text" id="messageInput" placeholder="🔒 Сообщение...">
                <button id="sendMsgBtn">➤</button>
            </div>
        </div>
    </div>
</div>

<script>
    let currentUser = null;
    let allChats = [];
    let activeChat = null;

    function save() {
        if(currentUser) {
            localStorage.setItem('alicean_' + currentUser.id, JSON.stringify({
                user: currentUser,
                chats: allChats
            }));
        }
    }

    // РЕГИСТРАЦИЯ
    function registerUser(name, phone, email, pass) {
        if(!name || !phone || !email || !pass) return 'Заполните все поля!';
        for(let i = 0; i < localStorage.length; i++) {
            let key = localStorage.key(i);
            if(key && key.startsWith('alicean_')) {
                try {
                    let data = JSON.parse(localStorage.getItem(key));
                    if(data.user.phone === phone) return 'Телефон уже занят!';
                    if(data.user.email === email) return 'Email уже занят!';
                } catch(e) {}
            }
        }
        let newId = Date.now() + '_' + Math.random();
        currentUser = { id: newId, name: name, phone: phone, email: email, password: pass, premium: false };
        allChats = [{
            id: 'main_' + Date.now(),
            name: '🌈 Общий чат',
            messages: [{ text: '✨ Добро пожаловать, ' + name + '!', sender: 'system', time: new Date().toLocaleTimeString() }]
        }];
        save();
        return 'ok';
    }

    // ВХОД
    function loginUser(identifier, pass) {
        for(let i = 0; i < localStorage.length; i++) {
            let key = localStorage.key(i);
            if(key && key.startsWith('alicean_')) {
                try {
                    let data = JSON.parse(localStorage.getItem(key));
                    let u = data.user;
                    if((u.phone === identifier || u.email === identifier || u.name === identifier) && u.password === pass) {
                        currentUser = u;
                        allChats = data.chats || [];
                        save();
                        return true;
                    }
                } catch(e) {}
            }
        }
        return false;
    }

    // СООБЩЕНИЯ
    function addMessage(chatId, text) {
        let chat = allChats.find(c => c.id === chatId);
        if(chat) {
            chat.messages.push({ text: text, sender: currentUser.name, time: new Date().toLocaleTimeString() });
            save();
            if(activeChat === chatId) renderMessages(chat);
            renderChatList();
        }
    }

    function renderMessages(chat) {
        let container = document.getElementById('messagesList');
        if(!chat.messages || chat.messages.length === 0) {
            container.innerHTML = '<div style="color: #aaa; text-align: center;">💬 Нет сообщений</div>';
            return;
        }
        container.innerHTML = '';
        for(let i = 0; i < chat.messages.length; i++) {
            let msg = chat.messages[i];
            let isMine = (msg.sender === currentUser.name);
            let div = document.createElement('div');
            div.className = 'message ' + (isMine ? 'message-mine' : 'message-other');
            div.innerHTML = '<div class="bubble"><b>' + (msg.sender !== 'system' ? msg.sender : '📢') + '</b><br>' + msg.text + '<div class="message-time">' + msg.time + '</div></div>';
            container.appendChild(div);
        }
        container.scrollTop = container.scrollHeight;
    }

    function renderChatList() {
        let container = document.getElementById('chatList');
        if(!allChats.length) {
            container.innerHTML = '<div style="color: #aaa;">Нет чатов</div>';
            return;
        }
        container.innerHTML = '';
        for(let i = 0; i < allChats.length; i++) {
            let chat = allChats[i];
            let div = document.createElement('div');
            div.className = 'chat-item';
            if(activeChat === chat.id) div.classList.add('active');
            div.innerHTML = '<div class="chat-name">' + chat.name + '</div><div style="font-size: 11px; color: #b0a0d0;">🔒 Защищён</div>';
            div.onclick = (function(c) { return function() {
                activeChat = c.id;
                document.getElementById('currentChatTitle').innerHTML = c.name;
                renderMessages(c);
                renderChatList();
            }; })(chat);
            container.appendChild(div);
        }
    }

    // ФУНКЦИИ
    function createChannel() {
        let name = prompt('🌈 Название канала:');
        if(name && name.trim()) {
            allChats.push({
                id: 'ch_' + Date.now(),
                name: name,
                messages: [{ text: '✨ Канал "' + name + '" создан!', sender: 'system', time: new Date().toLocaleTimeString() }]
            });
            save();
            renderChatList();
        }
    }

    function makeCall() {
        if(!activeChat) { alert('Сначала выберите чат'); return; }
        alert('📞 Защищённый звонок!\n🔒 Сквозное шифрование активно');
        addMessage(activeChat, '🔊 Аудиозвонок');
    }

    function sendGift() {
        if(!activeChat) { alert('Сначала выберите чат'); return; }
        let gifts = ['🌹 Роза', '🎂 Торт', '💖 Сердце', '⭐ Звезда', '👑 Корона'];
        let choice = prompt('🎁 Выберите подарок:\n1 - 🌹 Роза\n2 - 🎂 Торт\n3 - 💖 Сердце\n4 - ⭐ Звезда\n5 - 👑 Корона\n\nВведите номер 1-5:');
        if(choice >= 1 && choice <= 5) {
            addMessage(activeChat, '🎁 Подарок: ' + gifts[choice-1] + ' от ' + currentUser.name + '! 💝');
        }
    }

    function showPremium() {
        if(currentUser.premium) {
            alert('⭐ У вас уже есть Premium!');
            return;
        }
        let buy = confirm('⭐ Alicean Premium\n💰 100 ₽ / месяц\n\n🎁 Эксклюзивные подарки\n🌟 Особый значок\n🔒 Приоритетная поддержка\n\nКупить Premium?');
        if(buy) {
            currentUser.premium = true;
            save();
            document.getElementById('premiumBtn').style.background = '#ffd700';
            document.getElementById('premiumBtn').style.color = '#1a0b2e';
            alert('✅ Premium активирован! Спасибо за покупку!');
        }
    }

    function editProfile() {
        let newName = prompt('Новое имя:', currentUser.name);
        if(newName && newName.trim()) {
            currentUser.name = newName.trim();
            save();
            document.getElementById('profileName').innerHTML = currentUser.name;
            alert('Имя изменено!');
        }
        let newPhone = prompt('Номер телефона:', currentUser.phone);
        if(newPhone && newPhone.trim()) {
            currentUser.phone = newPhone.trim();
            save();
            document.getElementById('profilePhone').innerHTML = '📞 ' + currentUser.phone;
        }
    }

    function showChatUI() {
        document.getElementById('authScreen').classList.add('hidden');
        document.getElementById('chatScreen').classList.remove('hidden');
        document.getElementById('profileName').innerHTML = currentUser.name;
        document.getElementById('profilePhone').innerHTML = '📞 ' + currentUser.phone;
        if(currentUser.premium) {
            document.getElementById('premiumBtn').style.background = '#ffd700';
            document.getElementById('premiumBtn').style.color = '#1a0b2e';
        }
        renderChatList();
        if(allChats.length) {
            activeChat = allChats[0].id;
            document.getElementById('currentChatTitle').innerHTML = allChats[0].name;
            renderMessages(allChats[0]);
        }
    }

    // КНОПКИ
    document.getElementById('doLoginBtn').onclick = function() {
        let id = document.getElementById('loginId').value.trim();
        let pass = document.getElementById('loginPass').value.trim();
        let msgDiv = document.getElementById('loginError');
        if(!id || !pass) {
            msgDiv.classList.remove('hidden');
            msgDiv.className = 'msg error';
            msgDiv.innerText = 'Заполните поля!';
            return;
        }
        if(loginUser(id, pass)) {
            showChatUI();
        } else {
            msgDiv.classList.remove('hidden');
            msgDiv.className = 'msg error';
            msgDiv.innerText = 'Неверные данные!';
        }
    };

    document.getElementById('doRegBtn').onclick = function() {
        let name = document.getElementById('regName').value.trim();
        let phone = document.getElementById('regPhone').value.trim();
        let email = document.getElementById('regEmail').value.trim();
        let pass = document.getElementById('regPass').value.trim();
        let msgDiv = document.getElementById('regError');
        let res = registerUser(name, phone, email, pass);
        if(res === 'ok') {
            msgDiv.classList.remove('hidden');
            msgDiv.className = 'msg success';
            msgDiv.innerText = '✅ Аккаунт создан!';
            setTimeout(function() { showChatUI(); }, 1500);
        } else {
            msgDiv.classList.remove('hidden');
            msgDiv.className = 'msg error';
            msgDiv.innerText = res;
        }
    };

    document.getElementById('showRegBtn').onclick = function() {
        document.getElementById('loginBlock').classList.add('hidden');
        document.getElementById('registerBlock').classList.remove('hidden');
    };

    document.getElementById('showLoginBtn').onclick = function() {
        document.getElementById('registerBlock').classList.add('hidden');
        document.getElementById('loginBlock').classList.remove('hidden');
    };

    document.getElementById('sendMsgBtn').onclick = function() {
        let input = document.getElementById('messageInput');
        if(activeChat && input.value.trim()) {
            addMessage(activeChat, input.value.trim());
            input.value = '';
        }
    };

    document.getElementById('messageInput').addEventListener('keypress', function(e) {
        if(e.key === 'Enter') document.getElementById('sendMsgBtn').click();
    });

    document.getElementById('newChannelBtn').onclick = createChannel;
    document.getElementById('callChatBtn').onclick = makeCall;
    document.getElementById('giftChatBtn').onclick = sendGift;
    document.getElementById('editProfileBtn').onclick = editProfile;
    document.getElementById('premiumBtn').onclick = showPremium;

    document.getElementById('logoutChatBtn').onclick = function() {
        currentUser = null;
        document.getElementById('chatScreen').classList.add('hidden');
        document.getElementById('authScreen').classList.remove('hidden');
        document.getElementById('loginBlock').classList.remove('hidden');
        document.getElementById('registerBlock').classList.add('hidden');
        document.getElementById('loginId').value = '';
        document.getElementById('loginPass').value = '';
        document.getElementById('regName').value = '';
        document.getElementById('regPhone').value = '';
        document.getElementById('regEmail').value = '';
        document.getElementById('regPass').value = '';
    };
</script>
</body>
</html>
