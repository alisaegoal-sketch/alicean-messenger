<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alicean - Мессенджер</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1a0b2e, #0a0515);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .screen {
            max-width: 450px;
            width: 100%;
            background: #2a1a3e;
            border-radius: 30px;
            padding: 35px;
            border: 1px solid #ff77aa;
        }
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 10px;
        }
        .sub {
            color: #b0a0d0;
            text-align: center;
            margin-bottom: 25px;
        }
        input {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            background: #1a0b2e;
            border: 1px solid #8a6ab0;
            border-radius: 25px;
            color: white;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #ff6a8a;
            border: none;
            border-radius: 25px;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
        }
        .switch {
            background: transparent;
            border: 1px solid #ff77aa;
            margin-top: 10px;
        }
        .msg {
            text-align: center;
            margin-top: 15px;
            padding: 8px;
            border-radius: 15px;
            font-size: 13px;
        }
        .error { background: #ff4444; color: white; }
        .success { background: #44ff44; color: #1a0b2e; }
        
        /* Чат */
        .chat-layout {
            display: flex;
            width: 1200px;
            max-width: 100%;
            height: 85vh;
            background: #2a1a3e;
            border-radius: 30px;
            overflow: hidden;
        }
        .sidebar {
            width: 280px;
            background: #1f103f;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        .profile {
            color: white;
            padding-bottom: 20px;
            border-bottom: 1px solid #3a2a5a;
            margin-bottom: 15px;
        }
        .chats-list {
            flex: 1;
            overflow-y: auto;
        }
        .chat-item {
            background: #2a1a3e;
            padding: 12px;
            border-radius: 20px;
            margin-bottom: 8px;
            cursor: pointer;
        }
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .chat-title {
            padding: 20px;
            background: #1f103f;
            color: white;
            font-weight: bold;
            border-bottom: 1px solid #3a2a5a;
        }
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        .message-row {
            margin: 10px 0;
        }
        .my-message {
            text-align: right;
        }
        .my-message .bubble {
            background: #ff6a8a;
            display: inline-block;
            padding: 8px 15px;
            border-radius: 20px;
            max-width: 70%;
        }
        .other-message {
            text-align: left;
        }
        .other-message .bubble {
            background: #1a0b2e;
            display: inline-block;
            padding: 8px 15px;
            border-radius: 20px;
            max-width: 70%;
        }
        .input-row {
            padding: 20px;
            display: flex;
            gap: 10px;
            background: #1f103f;
        }
        .input-row input {
            margin: 0;
        }
        .input-row button {
            width: auto;
            margin: 0;
            padding: 14px 25px;
        }
        .logout {
            background: #e63946;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<!-- ЭКРАН ВХОДА -->
<div id="loginScreen" class="screen">
    <h1>🌈 Alicean</h1>
    <p class="sub">🔒 Безопасный мессенджер</p>
    
    <div id="loginForm">
        <input type="text" id="loginId" placeholder="Телефон, Email или Имя">
        <input type="password" id="loginPass" placeholder="Пароль">
        <div id="loginMsg" class="msg"></div>
        <button id="loginBtn">🔐 Войти</button>
        <button id="showRegisterBtn" class="switch">✨ Создать аккаунт</button>
    </div>

    <div id="registerForm" style="display: none;">
        <input type="text" id="regName" placeholder="Имя">
        <input type="tel" id="regPhone" placeholder="Телефон">
        <input type="email" id="regEmail" placeholder="Email">
        <input type="password" id="regPass" placeholder="Пароль">
        <div id="regMsg" class="msg"></div>
        <button id="registerBtn">📝 Зарегистрироваться</button>
        <button id="showLoginBtn" class="switch">🔐 Уже есть аккаунт?</button>
    </div>
</div>

<!-- ЧАТ -->
<div id="chatScreen" style="display: none;">
    <div class="chat-layout">
        <div class="sidebar">
            <div class="profile">
                <strong id="userName"></strong><br>
                <span id="userPhone" style="font-size: 12px;"></span>
                <div style="margin-top: 8px;">🔒 E2EE</div>
            </div>
            <div class="chats-list" id="chatsList"></div>
            <button id="createChannel">📢 Новый канал</button>
            <button id="callBtn" style="margin-top: 10px;">📞 Звонок</button>
            <button id="logoutChat" class="logout">🚪 Выйти</button>
        </div>
        <div class="main-chat">
            <div class="chat-title" id="chatTitle">Выберите чат</div>
            <div class="messages-area" id="messagesArea">
                <div style="color: #aaa; text-align: center;">💬 Нажмите на чат слева</div>
            </div>
            <div class="input-row">
                <input type="text" id="msgInput" placeholder="Сообщение...">
                <button id="sendMsg">➤</button>
            </div>
        </div>
    </div>
</div>

<script>
    // ========== ОСНОВНЫЕ ПЕРЕМЕННЫЕ ==========
    let currentUser = null;
    let chats = [];
    let activeChat = null;

    // Сохранение данных
    function saveData() {
        if(currentUser) {
            localStorage.setItem(`alicean_${currentUser.id}`, JSON.stringify({
                user: currentUser,
                chats: chats
            }));
        }
    }

    // ========== РЕГИСТРАЦИЯ ==========
    function register(name, phone, email, pass) {
        if(!name || !phone || !email || !pass) {
            return { ok: false, error: "Заполните все поля!" };
        }
        
        // Проверка уникальности
        for(let i = 0; i < localStorage.length; i++) {
            let key = localStorage.key(i);
            if(key && key.startsWith('alicean_')) {
                let data = JSON.parse(localStorage.getItem(key));
                if(data.user.phone === phone) {
                    return { ok: false, error: "Телефон уже занят!" };
                }
                if(data.user.email === email) {
                    return { ok: false, error: "Email уже занят!" };
                }
            }
        }
        
        let id = Date.now() + "_" + Math.random();
        currentUser = {
            id: id,
            name: name,
            phone: phone,
            email: email,
            password: pass
        };
        
        chats = [{
            id: "chat1",
            name: "🌈 Главный чат",
            messages: [{
                text: `✨ Добро пожаловать, ${name}!`,
                sender: "system",
                time: new Date().toLocaleTimeString()
            }]
        }];
        
        saveData();
        return { ok: true };
    }

    // ========== ВХОД ==========
    function login(identifier, pass) {
        for(let i = 0; i < localStorage.length; i++) {
            let key = localStorage.key(i);
            if(key && key.startsWith('alicean_')) {
                let data = JSON.parse(localStorage.getItem(key));
                let u = data.user;
                if((u.phone === identifier || u.email === identifier || u.name === identifier) && u.password === pass) {
                    currentUser = u;
                    chats = data.chats || [];
                    saveData();
                    return { ok: true };
                }
            }
        }
        return { ok: false, error: "Неверные данные!" };
    }

    // ========== ЧАТЫ ==========
    function addMessage(chatId, text) {
        let chat = chats.find(c => c.id === chatId);
        if(chat) {
            chat.messages.push({
                text: text,
                sender: currentUser.name,
                time: new Date().toLocaleTimeString()
            });
            saveData();
            if(activeChat === chatId) renderMessages(chat);
            renderChatList();
        }
    }

    function renderMessages(chat) {
        let container = document.getElementById('messagesArea');
        if(!chat.messages || chat.messages.length === 0) {
            container.innerHTML = '<div style="color:#aaa; text-align:center;">Нет сообщений</div>';
            return;
        }
        container.innerHTML = '';
        chat.messages.forEach(msg => {
            let isMy = msg.sender === currentUser.name;
            let div = document.createElement('div');
            div.className = `message-row ${isMy ? 'my-message' : 'other-message'}`;
            div.innerHTML = `<div class="bubble"><b>${msg.sender !== 'system' ? msg.sender : '📢'}</b><br>${msg.text}<div style="font-size:10px;">${msg.time}</div></div>`;
            container.appendChild(div);
        });
        container.scrollTop = container.scrollHeight;
    }

    function renderChatList() {
        let container = document.getElementById('chatsList');
        if(!chats.length) {
            container.innerHTML = '<div style="color:#aaa;">Нет чатов</div>';
            return;
        }
        container.innerHTML = '';
        chats.forEach(chat => {
            let div = document.createElement('div');
            div.className = 'chat-item';
            div.innerHTML = `<b>${chat.name}</b><br><span style="font-size:11px;">🔒 Защищён</span>`;
            if(activeChat === chat.id) div.style.background = '#ff77aa';
            div.onclick = () => {
                activeChat = chat.id;
                document.getElementById('chatTitle').innerHTML = chat.name;
                renderMessages(chat);
                renderChatList();
            };
            container.appendChild(div);
        });
    }

    function createChannel() {
        let name = prompt("Название канала:");
        if(name) {
            chats.push({
                id: "ch_" + Date.now(),
                name: name,
                messages: [{ text: `✨ Канал "${name}" создан!`, sender: "system", time: new Date().toLocaleTimeString() }]
            });
            saveData();
            renderChatList();
        }
    }

    function showChat() {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('chatScreen').style.display = 'block';
        document.getElementById('userName').innerHTML = currentUser.name;
        document.getElementById('userPhone').innerHTML = `📞 ${currentUser.phone}`;
        renderChatList();
        if(chats.length) {
            activeChat = chats[0].id;
            document.getElementById('chatTitle').innerHTML = chats[0].name;
            renderMessages(chats[0]);
        }
    }

    // ========== НАСТРОЙКА КНОПОК ==========
    document.getElementById('loginBtn').onclick = () => {
        let id = document.getElementById('loginId').value.trim();
        let pass = document.getElementById('loginPass').value.trim();
        let msgDiv = document.getElementById('loginMsg');
        
        if(!id || !pass) {
            msgDiv.className = 'msg error';
            msgDiv.innerText = "Заполните поля!";
            return;
        }
        
        let res = login(id, pass);
        if(res.ok) {
            showChat();
        } else {
            msgDiv.className = 'msg error';
            msgDiv.innerText = res.error;
        }
    };

    document.getElementById('registerBtn').onclick = () => {
        let name = document.getElementById('regName').value.trim();
        let phone = document.getElementById('regPhone').value.trim();
        let email = document.getElementById('regEmail').value.trim();
        let pass = document.getElementById('regPass').value.trim();
        let msgDiv = document.getElementById('regMsg');
        
        let res = register(name, phone, email, pass);
        if(res.ok) {
            msgDiv.className = 'msg success';
            msgDiv.innerText = "✅ Аккаунт создан! Вход...";
            setTimeout(() => {
                showChat();
            }, 1500);
        } else {
            msgDiv.className = 'msg error';
            msgDiv.innerText = res.error;
        }
    };

    document.getElementById('showRegisterBtn').onclick = () => {
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('registerForm').style.display = 'block';
    };

    document.getElementById('showLoginBtn').onclick = () => {
        document.getElementById('loginForm').style.display = 'block';
        document.getElementById('registerForm').style.display = 'none';
    };

    document.getElementById('sendMsg').onclick = () => {
        let input = document.getElementById('msgInput');
        if(activeChat && input.value.trim()) {
            addMessage(activeChat, input.value.trim());
            input.value = '';
        }
    };

    document.getElementById('msgInput').addEventListener('keypress', (e) => {
        if(e.key === 'Enter') document.getElementById('sendMsg').click();
    });

    document.getElementById('createChannel').onclick = createChannel;
    
    document.getElementById('callBtn').onclick = () => {
        if(activeChat) {
            alert("📞 Защищённый звонок!\n🔒 Сквозное шифрование активно");
            addMessage(activeChat, "🔊 Аудиозвонок");
        } else {
            alert("Сначала выберите чат");
        }
    };

    document.getElementById('logoutChat').onclick = () => {
        currentUser = null;
        document.getElementById('loginScreen').style.display = 'block';
        document.getElementById('chatScreen').style.display = 'none';
        document.getElementById('loginForm').style.display = 'block';
        document.getElementById('registerForm').style.display = 'none';
        document.getElementById('loginId').value = '';
        document.getElementById('loginPass').value = '';
    };
</script>
</body>
</html>
