<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alicean — Радужный мессенджер</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        body {
            background: radial-gradient(circle at 20% 30%, #1a0b2e, #0a0515);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        @keyframes rainbow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: rgba(30, 20, 50, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 40px;
            border: 1px solid rgba(255,200,200,0.3);
            text-align: center;
        }
        h1 {
            color: white;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #ff0a54, #ff9f4a, #ffd166, #6a4eff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: rainbow 3s infinite;
            background-size: 200% 200%;
        }
        .subtitle {
            color: #b0a0d0;
            margin-bottom: 30px;
        }
        input {
            width: 100%;
            padding: 14px 18px;
            margin: 8px 0;
            background: #2a1a3e;
            border: 1px solid #8a6ab0;
            border-radius: 30px;
            color: white;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #ff6a8a, #c55cff);
            border: none;
            border-radius: 30px;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
        }
        .switch-btn {
            background: transparent;
            border: 1px solid #ff77aa;
        }
        .msg {
            text-align: center;
            margin-top: 15px;
            padding: 10px;
            border-radius: 20px;
            font-size: 14px;
        }
        .error { background: #ff444420; color: #ff8888; }
        .success { background: #44ff4420; color: #88ff88; }
        
        /* Стили для чата */
        .chat-container {
            max-width: 1300px;
            width: 100%;
            height: 90vh;
            background: rgba(30, 20, 50, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            display: flex;
            overflow: hidden;
            border: 2px solid transparent;
            animation: borderPulse 3s infinite;
        }
        @keyframes borderPulse {
            0% { border-color: #ff0a54; }
            50% { border-color: #6a4eff; }
            100% { border-color: #ff0a54; }
        }
        .sidebar {
            width: 300px;
            background: rgba(20, 10, 35, 0.9);
            border-right: 1px solid #3a2a5a;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        .profile-info {
            color: white;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #3a2a5a;
            text-align: left;
        }
        .profile-avatar {
            font-size: 48px;
            margin-bottom: 10px;
        }
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .chat-header {
            padding: 20px;
            border-bottom: 1px solid #3a2a5a;
            color: white;
            font-weight: bold;
            background: linear-gradient(90deg, #2a1a4a, #1f103f);
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        .input-row {
            padding: 20px;
            display: flex;
            gap: 10px;
            border-top: 1px solid #3a2a5a;
            background: #1a0b2e;
        }
        .input-row input {
            margin: 0;
            flex: 1;
        }
        .input-row button {
            width: auto;
            margin: 0;
            padding: 12px 24px;
        }
        .chat-item {
            padding: 12px;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        .chat-item:hover {
            background: rgba(255,120,160,0.2);
            transform: translateX(5px);
        }
        .chat-item.active {
            background: linear-gradient(95deg, #b259ff30, #ff77aa30);
            border-left: 4px solid #ffb86b;
        }
        .my-message {
            text-align: right;
            margin: 10px 0;
        }
        .my-message .bubble {
            display: inline-block;
            background: linear-gradient(135deg, #c55cff, #ff6a8a);
            padding: 10px 16px;
            border-radius: 20px;
            max-width: 70%;
            color: white;
        }
        .other-message {
            text-align: left;
            margin: 10px 0;
        }
        .other-message .bubble {
            display: inline-block;
            background: #2a1a3e;
            padding: 10px 16px;
            border-radius: 20px;
            max-width: 70%;
            color: white;
        }
        .time {
            font-size: 10px;
            opacity: 0.6;
            margin-top: 4px;
        }
        .logout-btn {
            background: #e63946;
            margin-top: auto;
        }
        .security-badge {
            background: #00ff9d20;
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 11px;
            display: inline-block;
            margin-top: 10px;
            color: #00ff9d;
        }
    </style>
</head>
<body>

<!-- ЭКРАН ВХОДА/РЕГИСТРАЦИИ -->
<div id="authScreen" class="container">
    <h1>🌈 Alicean</h1>
    <p class="subtitle">🔒 Безопасный радужный мессенджер</p>
    
    <div id="loginBlock">
        <input type="text" id="loginId" placeholder="Телефон, Email или Имя">
        <input type="password" id="loginPass" placeholder="Пароль">
        <div id="loginMsg" class="msg"></div>
        <button id="doLoginBtn">🔐 Войти</button>
        <button id="showRegBtn" class="switch-btn">✨ Создать аккаунт</button>
    </div>

    <div id="regBlock" style="display: none;">
        <input type="text" id="regName" placeholder="Имя пользователя">
        <input type="tel" id="regPhone" placeholder="Номер телефона">
        <input type="email" id="regEmail" placeholder="Email">
        <input type="password" id="regPass" placeholder="Пароль">
        <div id="regMsg" class="msg"></div>
        <button id="doRegBtn">📝 Зарегистрироваться</button>
        <button id="showLoginBtn" class="switch-btn">🔐 Уже есть аккаунт? Войти</button>
    </div>
</div>

<!-- ЧАТ -->
<div id="chatScreen" style="display: none;">
    <div class="chat-container">
        <div class="sidebar">
            <div class="profile-info">
                <div class="profile-avatar">🌈</div>
                <strong id="userName"></strong><br>
                <span id="userContact" style="font-size: 12px;"></span>
                <div><span class="security-badge">🔒 МАКСИМАЛЬНАЯ ЗАЩИТА</span></div>
            </div>
            <div id="chatsList" style="flex: 1; overflow-y: auto;"></div>
            <button id="newChannelBtn" style="margin: 10px 0;">📢 Создать канал</button>
            <button id="callBtn" style="margin: 5px 0;">📞 Звонок (🔒)</button>
            <button id="logoutBtn" class="logout-btn">🚪 Выйти</button>
        </div>
        <div class="main-chat">
            <div class="chat-header" id="currentChatTitle">✨ Выберите чат ✨</div>
            <div class="messages" id="messagesArea">
                <div style="color: #aaa; text-align: center;">💬 Нажмите на чат слева, чтобы начать общение</div>
            </div>
            <div class="input-row">
                <input type="text" id="msgInput" placeholder="🔒 Сообщение...">
                <button id="sendMsgBtn">➤</button>
            </div>
        </div>
    </div>
</div>

<script>
    // ========== ДАННЫЕ ==========
    let currentUser = null;
    let chats = [];
    let activeChatId = null;

    function saveData() {
        if(currentUser) {
            localStorage.setItem(`alicean_${currentUser.id}`, JSON.stringify({
                user: currentUser,
                chats: chats
            }));
        }
    }

    // РЕГИСТРАЦИЯ
    function registerUser(name, phone, email, password) {
        if(!name || !phone || !email || !password) {
            return { ok: false, error: "❌ Заполните все поля!" };
        }
        
        for(let i = 0; i < localStorage.length; i++) {
            let key = localStorage.key(i);
            if(key && key.startsWith('alicean_')) {
                let data = JSON.parse(localStorage.getItem(key));
                if(data.user.phone === phone) {
                    return { ok: false, error: "❌ Телефон уже зарегистрирован!" };
                }
                if(data.user.email === email) {
                    return { ok: false, error: "❌ Email уже зарегистрирован!" };
                }
            }
        }
        
        let newId = Date.now() + "_" + Math.random();
        currentUser = {
            id: newId,
            name: name,
            phone: phone,
            email: email,
            password: password,
            avatar: "🌈"
        };
        
        chats = [{
            id: "welcome_" + Date.now(),
            name: "🌈 Радужный канал",
            messages: [{
                text: `✨ Добро пожаловать, ${name}! Это ваш защищённый чат. Все сообщения шифруются 🔒`,
                sender: "system",
                time: new Date().toLocaleTimeString()
            }]
        }];
        
        saveData();
        return { ok: true };
    }

    // ВХОД
    function loginUser(identifier, password) {
        for(let i = 0; i < localStorage.length; i++) {
            let key = localStorage.key(i);
            if(key && key.startsWith('alicean_')) {
                let data = JSON.parse(localStorage.getItem(key));
                let u = data.user;
                if((u.phone === identifier || u.email === identifier || u.name === identifier) && u.password === password) {
                    currentUser = u;
                    chats = data.chats || [];
                    saveData();
                    return { ok: true };
                }
            }
        }
        return { ok: false, error: "❌ Неверный телефон/email или пароль!" };
    }

    // ========== ЧАТЫ ==========
    function addMessage(chatId, text) {
        let chat = chats.find(c => c.id === chatId);
        if(chat) {
            chat.messages.push({
                text: text,
                sender: currentUser.name,
                time: new Date().toLocaleTimeString()
            });
            saveData();
            if(activeChatId === chatId) renderMessages(chat);
            renderChatsList();
        }
    }

    function renderMessages(chat) {
        let container = document.getElementById('messagesArea');
        if(!chat.messages || chat.messages.length === 0) {
            container.innerHTML = '<div style="color:#aaa; text-align:center;">💬 Нет сообщений. Напишите первое!</div>';
            return;
        }
        container.innerHTML = '';
        chat.messages.forEach(msg => {
            let isMy = msg.sender === currentUser.name;
            let div = document.createElement('div');
            div.className = isMy ? 'my-message' : 'other-message';
            div.innerHTML = `<div class="bubble"><b>${msg.sender !== 'system' ? msg.sender : '📢 Система'}</b><br>${msg.text}<div class="time">${msg.time} 🔒</div></div>`;
            container.appendChild(div);
        });
        container.scrollTop = container.scrollHeight;
    }

    function renderChatsList() {
        let container = document.getElementById('chatsList');
        if(!chats.length) {
            container.innerHTML = '<div style="color:#aaa;">Нет чатов. Создайте канал!</div>';
            return;
        }
        container.innerHTML = '';
        chats.forEach(chat => {
            let div = document.createElement('div');
            div.className = 'chat-item';
            if(activeChatId === chat.id) div.classList.add('active');
            div.innerHTML = `<b>${chat.name}</b><br><span style="font-size:11px;">🔒 Защищён</span>`;
            div.onclick = () => {
                activeChatId = chat.id;
                document.getElementById('currentChatTitle').innerHTML = chat.name;
                renderMessages(chat);
                renderChatsList();
            };
            container.appendChild(div);
        });
    }

    function createChannel() {
        let name = prompt("🌈 Название канала:");
        if(name && name.trim()) {
            chats.push({
                id: "channel_" + Date.now(),
                name: name,
                messages: [{ text: `✨ Канал "${name}" создан! Добро пожаловать.`, sender: "system", time: new Date().toLocaleTimeString() }]
            });
            saveData();
            renderChatsList();
        }
    }

    function makeCall() {
        if(!activeChatId) {
            alert("📞 Сначала выберите чат");
            return;
        }
        alert("📞 Защищённый звонок (WebRTC + DTLS-SRTP)\n🔒 Сквозное шифрование активно");
        addMessage(activeChatId, "🔊 Совершён защищённый аудиозвонок");
    }

    function showChat() {
        document.getElementById('authScreen').style.display = 'none';
        document.getElementById('chatScreen').style.display = 'block';
        document.getElementById('userName').innerHTML = currentUser.name;
        document.getElementById('userContact').innerHTML = `📞 ${currentUser.phone} | ✉️ ${currentUser.email}`;
        renderChatsList();
        if(chats.length) {
            activeChatId = chats[0].id;
            document.getElementById('currentChatTitle').innerHTML = chats[0].name;
            renderMessages(chats[0]);
        }
    }

    // ========== КНОПКИ ==========
    document.getElementById('doLoginBtn').onclick = () => {
        let id = document.getElementById('loginId').value.trim();
        let pass = document.getElementById('loginPass').value.trim();
        let msgDiv = document.getElementById('loginMsg');
        
        if(!id || !pass) {
            msgDiv.className = 'msg error';
            msgDiv.innerText = "❌ Заполните все поля!";
            return;
        }
        
        let res = loginUser(id, pass);
        if(res.ok) {
            showChat();
        } else {
            msgDiv.className = 'msg error';
            msgDiv.innerText = res.error;
        }
    };

    document.getElementById('doRegBtn').onclick = () => {
        let name = document.getElementById('regName').value.trim();
        let phone = document.getElementById('regPhone').value.trim();
        let email = document.getElementById('regEmail').value.trim();
        let pass = document.getElementById('regPass').value.trim();
        let msgDiv = document.getElementById('regMsg');
        
        let res = registerUser(name, phone, email, pass);
        if(res.ok) {
            msgDiv.className = 'msg success';
            msgDiv.innerText = "✅ Аккаунт создан! Вход выполняется...";
            setTimeout(() => {
                showChat();
            }, 1500);
        } else {
            msgDiv.className = 'msg error';
            msgDiv.innerText = res.error;
        }
    };

    document.getElementById('showRegBtn').onclick = () => {
        document.getElementById('loginBlock').style.display = 'none';
        document.getElementById('regBlock').style.display = 'block';
        document.getElementById('loginMsg').innerText = '';
    };

    document.getElementById('showLoginBtn').onclick = () => {
        document.getElementById('loginBlock').style.display = 'block';
        document.getElementById('regBlock').style.display = 'none';
        document.getElementById('regMsg').innerText = '';
    };

    document.getElementById('sendMsgBtn').onclick = () => {
        let input = document.getElementById('msgInput');
        if(activeChatId && input.value.trim()) {
            addMessage(activeChatId, input.value.trim());
            input.value = '';
        } else if(!activeChatId) {
            alert("Сначала выберите чат");
        }
    };

    document.getElementById('msgInput').addEventListener('keypress', (e) => {
        if(e.key === 'Enter') document.getElementById('sendMsgBtn').click();
    });

    document.getElementById('newChannelBtn').onclick = createChannel;
    document.getElementById('callBtn').onclick = makeCall;

    document.getElementById('logoutBtn').onclick = () => {
        currentUser = null;
        document.getElementById('authScreen').style.display = 'block';
        document.getElementById('chatScreen').style.display = 'none';
        document.getElementById('loginBlock').style.display = 'block';
        document.getElementById('regBlock').style.display = 'none';
        document.getElementById('loginId').value = '';
        document.getElementById('loginPass').value = '';
        document.getElementById('regName').value = '';
        document.getElementById('regPhone').value = '';
        document.getElementById('regEmail').value = '';
        document.getElementById('regPass').value = '';
        document.getElementById('loginMsg').innerText = '';
        document.getElementById('regMsg').innerText = '';
    };
</script>
</body>
</html>
