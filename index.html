<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Alicean | Безопасный мессенджер</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #1a0b2e 0%, #0a0515 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .app-container {
      max-width: 1300px;
      width: 100%;
      height: 90vh;
      background: rgba(22, 12, 38, 0.7);
      backdrop-filter: blur(16px);
      border-radius: 42px;
      box-shadow: 0 25px 45px rgba(0,0,0,0.3);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .main-layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    .chats-sidebar {
      width: 280px;
      background: rgba(12, 6, 25, 0.7);
      border-right: 1px solid rgba(255,210,210,0.2);
      display: flex;
      flex-direction: column;
    }
    .user-profile {
      padding: 20px;
      background: linear-gradient(115deg, #2a1a4a, #1f103f);
      cursor: pointer;
    }
    .profile-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .profile-avatar {
      width: 50px;
      height: 50px;
      background: linear-gradient(145deg, #ffb347, #ff6b9d);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }
    .profile-info h3 { color: white; font-size: 1rem; }
    .profile-info p { font-size: 0.7rem; color: #cbb3ff; }
    .chats-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }
    .chat-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: rgba(255,255,210,0.05);
      border-radius: 24px;
      margin-bottom: 8px;
      cursor: pointer;
    }
    .chat-item.active {
      background: linear-gradient(95deg, #b259ff30, #ff77aa30);
    }
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .chat-header-area {
      padding: 15px 20px;
      background: rgba(30, 18, 55, 0.7);
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #ffb47b40;
    }
    .messages-view {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .message {
      display: flex;
      max-width: 70%;
    }
    .message.outgoing { align-self: flex-end; }
    .bubble {
      padding: 10px 16px;
      border-radius: 20px;
      background: #2d1f49;
      color: white;
    }
    .input-message {
      padding: 15px 20px;
      background: #1e1135;
      display: flex;
      gap: 12px;
    }
    .msg-input-field {
      flex: 1;
      background: #2b1d46;
      border-radius: 30px;
      padding: 12px 18px;
      color: white;
      border: none;
      outline: none;
    }
    .send-msg-btn {
      background: linear-gradient(145deg, #ff7e9e, #d46cb3);
      border: none;
      width: 48px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 20px;
    }
    button {
      background: linear-gradient(90deg, #ff6a8a, #b1549b);
      border: none;
      padding: 8px 16px;
      border-radius: 40px;
      color: white;
      cursor: pointer;
    }
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.9);
      backdrop-filter: blur(12px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-card {
      width: 400px;
      background: #231b3c;
      border-radius: 48px;
      padding: 32px;
      border: 1px solid #ffbd9f;
    }
    .modal-card h2 { color: white; text-align: center; margin-bottom: 20px; }
    .modal-card input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      background: #2f224b;
      border: none;
      border-radius: 40px;
      color: white;
    }
    .error-msg { color: #ff8888; text-align: center; margin-top: 10px; font-size: 0.8rem; }
    .security-info {
      background: #1a0b2e;
      border-radius: 20px;
      padding: 15px;
      margin: 15px 0;
      text-align: center;
    }
    .security-info p { color: #00ff9d; font-size: 0.8rem; }
  </style>
</head>
<body>
<div class="app-container" id="appRoot" style="display: none;">
  <div class="main-layout">
    <div class="chats-sidebar">
      <div class="user-profile" id="profileBtn">
        <div class="profile-row">
          <div class="profile-avatar" id="globalAvatar">🌈</div>
          <div class="profile-info">
            <h3 id="profileName"></h3>
            <p id="profileContact"></p>
          </div>
        </div>
      </div>
      <div class="chats-list" id="chatsList"></div>
      <button id="logoutBtn" style="margin: 10px;">🚪 Выйти</button>
    </div>
    <div class="chat-area">
      <div class="chat-header-area">
        <span id="currentChat" style="font-weight:bold;">Выберите чат</span>
        <span>🔒 E2EE</span>
      </div>
      <div class="messages-view" id="messagesArea"><div class="empty-chat">💬 Напишите сообщение</div></div>
      <div class="input-message">
        <input type="text" class="msg-input-field" id="msgInput" placeholder="Сообщение...">
        <button class="send-msg-btn" id="sendBtn">➤</button>
      </div>
    </div>
  </div>
</div>

<script>
  // Простое шифрование
  function encrypt(text, key) { return btoa(text); }
  function decrypt(text, key) { try { return atob(text); } catch(e) { return "🔒 Зашифровано"; } }
  
  let currentUser = null;
  let chats = [];
  let activeChat = null;
  
  function saveData() {
    if(currentUser) localStorage.setItem(`alicean_${currentUser.id}`, JSON.stringify({ user: currentUser, chats }));
  }
  
  function register(name, phone, email, pass) {
    if(!name || !phone || !email || !pass) return "Заполните все поля!";
    for(let i=0; i<localStorage.length; i++) {
      let key = localStorage.key(i);
      if(key && key.startsWith('alicean_')) {
        let data = JSON.parse(localStorage.getItem(key));
        if(data.user.phone === phone) return "Телефон уже зарегистрирован";
        if(data.user.email === email) return "Email уже зарегистрирован";
      }
    }
    let id = Date.now() + "_" + Math.random().toString(36).substr(2, 6);
    currentUser = { id, name, phone, email, password: pass, avatar: "🌈" };
    chats = [{ id: "welcome", name: "🌈 Добро пожаловать", type: "channel", messages: [{ text: `Добро пожаловать, ${name}!`, sender: "system", time: new Date().toLocaleTimeString() }] }];
    saveData();
    return "ok";
  }
  
  function login(identifier, pass) {
    for(let i=0; i<localStorage.length; i++) {
      let key = localStorage.key(i);
      if(key && key.startsWith('alicean_')) {
        let data = JSON.parse(localStorage.getItem(key));
        let u = data.user;
        if((u.phone === identifier || u.email === identifier || u.name === identifier) && u.password === pass) {
          currentUser = u;
          chats = data.chats;
          saveData();
          return true;
        }
      }
    }
    return false;
  }
  
  function addMessage(chatId, text) {
    let chat = chats.find(c => c.id === chatId);
    if(chat) {
      chat.messages.push({ text: encrypt(text, chatId), sender: currentUser.name, time: new Date().toLocaleTimeString() });
      saveData();
      if(activeChat === chatId) renderMessages(chat);
      renderChats();
    }
  }
  
  function renderMessages(chat) {
    let container = document.getElementById('messagesArea');
    if(!chat.messages.length) { container.innerHTML = '<div class="empty-chat">Нет сообщений</div>'; return; }
    container.innerHTML = '';
    chat.messages.forEach(msg => {
      let isOut = msg.sender === currentUser?.name;
      let div = document.createElement('div');
      div.className = `message ${isOut ? 'outgoing' : ''}`;
      div.innerHTML = `<div class="bubble">${msg.sender !== 'system' ? decrypt(msg.text, chat.id) : msg.text}<div style="font-size:10px; opacity:0.6;">${msg.time}</div></div>`;
      container.appendChild(div);
    });
    container.scrollTop = container.scrollHeight;
  }
  
  function renderChats() {
    let container = document.getElementById('chatsList');
    if(!chats.length) { container.innerHTML = '<div style="padding:16px; color:#aaa;">Нет чатов</div>'; return; }
    container.innerHTML = '';
    chats.forEach(chat => {
      let div = document.createElement('div');
      div.className = `chat-item ${activeChat === chat.id ? 'active' : ''}`;
      div.innerHTML = `<div class="chat-avatar">📢</div><div><div>${chat.name}</div><div style="font-size:11px; color:#aaa;">🔒 Защищён</div></div>`;
      div.onclick = () => { activeChat = chat.id; renderMessages(chat); renderChats(); };
      container.appendChild(div);
    });
  }
  
  function updateUI() {
    document.getElementById('profileName').innerText = currentUser.name;
    document.getElementById('profileContact').innerHTML = `📞 ${currentUser.phone}`;
    document.getElementById('globalAvatar').innerText = currentUser.avatar;
    renderChats();
    if(chats.length) { activeChat = chats[0].id; renderMessages(chats[0]); }
  }
  
  function showAuth() {
    let modal = document.createElement('div');
    modal.className = 'modal-overlay';
    let isLogin = true;
    function render() {
      if(isLogin) {
        modal.innerHTML = `<div class="modal-card"><h2>🔐 Вход</h2><div class="security-info"><p>🔒 Сквозное шифрование</p></div><input type="text" id="loginId" placeholder="Телефон / Email / Имя"><input type="password" id="loginPass" placeholder="Пароль"><div id="authError" class="error-msg"></div><button id="submitBtn">Войти</button><button id="toggleBtn" style="background:#5a4a7a;">✨ Создать аккаунт</button></div>`;
      } else {
        modal.innerHTML = `<div class="modal-card"><h2>🌈 Регистрация</h2><input type="text" id="regName" placeholder="Имя"><input type="tel" id="regPhone" placeholder="Телефон"><input type="email" id="regEmail" placeholder="Email"><input type="password" id="regPass" placeholder="Пароль"><div id="authError" class="error-msg"></div><button id="submitBtn">Зарегистрироваться</button><button id="toggleBtn" style="background:#5a4a7a;">🔐 Уже есть аккаунт?</button></div>`;
      }
      document.getElementById('submitBtn').onclick = () => {
        let errorDiv = document.getElementById('authError');
        if(isLogin) {
          let id = document.getElementById('loginId')?.value.trim();
          let pass = document.getElementById('loginPass')?.value.trim();
          if(!id || !pass) { errorDiv.innerText = "Заполните поля"; return; }
          if(login(id, pass)) {
            modal.remove();
            document.getElementById('appRoot').style.display = 'flex';
            updateUI();
          } else errorDiv.innerText = "Неверные данные";
        } else {
          let name = document.getElementById('regName')?.value.trim();
          let phone = document.getElementById('regPhone')?.value.trim();
          let email = document.getElementById('regEmail')?.value.trim();
          let pass = document.getElementById('regPass')?.value.trim();
          let res = register(name, phone, email, pass);
          if(res === "ok") {
            errorDiv.style.color = '#88ff88';
            errorDiv.innerText = "✅ Аккаунт создан!";
            setTimeout(() => {
              modal.remove();
              document.getElementById('appRoot').style.display = 'flex';
              updateUI();
            }, 1000);
          } else errorDiv.innerText = res;
        }
      };
      document.getElementById('toggleBtn').onclick = () => { isLogin = !isLogin; render(); };
    }
    render();
    document.body.appendChild(modal);
  }
  
  document.getElementById('sendBtn')?.addEventListener('click', () => {
    let input = document.getElementById('msgInput');
    if(activeChat && input.value.trim()) {
      addMessage(activeChat, input.value.trim());
      input.value = '';
    }
  });
  document.getElementById('msgInput')?.addEventListener('keypress', (e) => { if(e.key === 'Enter') document.getElementById('sendBtn').click(); });
  document.getElementById('logoutBtn')?.addEventListener('click', () => {
    currentUser = null;
    document.getElementById('appRoot').style.display = 'none';
    showAuth();
  });
  
  showAuth();
</script>
</body>
</html>
