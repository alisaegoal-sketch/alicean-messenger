<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Alicean — Мессенджер</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #1a0b2e, #0a0515);
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 400px;
            width: 100%;
            background: #2a1a3e;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
        }
        h1 {
            color: white;
            margin-bottom: 10px;
        }
        p {
            color: #b0a0d0;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background: #1a0b2e;
            border: 1px solid #ff77aa;
            border-radius: 25px;
            color: white;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #ff6a8a;
            border: none;
            border-radius: 25px;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn2 {
            background: transparent;
            border: 1px solid #ff77aa;
            margin-top: 5px;
        }
        .msg {
            margin-top: 15px;
            padding: 8px;
            border-radius: 10px;
            font-size: 13px;
        }
        .error { background: #ff4444; color: white; }
        .success { background: #44aa44; color: white; }
        .hidden { display: none; }
        
        /* Чат */
        .chat-layout {
            display: flex;
            width: 1000px;
            max-width: 100%;
            height: 80vh;
            background: #2a1a3e;
            border-radius: 20px;
            overflow: hidden;
        }
        .sidebar {
            width: 250px;
            background: #1f103f;
            padding: 15px;
            display: flex;
            flex-direction: column;
        }
        .profile {
            color: white;
            padding-bottom: 15px;
            border-bottom: 1px solid #ff77aa;
            margin-bottom: 15px;
        }
        .profile-name {
            font-size: 18px;
            font-weight: bold;
        }
        .chat-list {
            flex: 1;
            overflow-y: auto;
        }
        .chat-item {
            background: #2a1a3e;
            padding: 10px;
            border-radius: 15px;
            margin-bottom: 8px;
            cursor: pointer;
        }
        .chat-item.active {
            background: #ff6a8a;
        }
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .chat-header {
            padding: 15px;
            background: #1f103f;
            color: white;
            font-weight: bold;
            border-bottom: 1px solid #ff77aa;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }
        .message-mine {
            text-align: right;
            margin: 8px 0;
        }
        .message-mine .bubble {
            background: #ff6a8a;
            display: inline-block;
            padding: 8px 15px;
            border-radius: 18px;
            max-width: 70%;
        }
        .message-other {
            text-align: left;
            margin: 8px 0;
        }
        .message-other .bubble {
            background: #3a2a5a;
            display: inline-block;
            padding: 8px 15px;
            border-radius: 18px;
            max-width: 70%;
        }
        .time {
            font-size: 10px;
            opacity: 0.7;
            margin-top: 3px;
        }
        .input-area {
            padding: 15px;
            display: flex;
            gap: 10px;
            border-top: 1px solid #ff77aa;
            background: #1f103f;
        }
        .input-area input {
            margin: 0;
        }
        .input-area button {
            width: auto;
            margin: 0;
            padding: 12px 20px;
        }
        .btn-red {
            background: #e63946;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div id="authScreen" class="container">
    <h1>🌈 Alicean</h1>
    <p>🔒 Безопасный мессенджер</p>
    
    <div id="loginDiv">
        <input type="text" id="loginId" placeholder="Телефон или Email">
        <input type="password" id="loginPass" placeholder="Пароль">
        <div id="loginMsg" class="msg hidden"></div>
        <button id="loginBtn">Войти</button>
        <button id="toRegBtn" class="btn2">Создать аккаунт</button>
    </div>

    <div id="regDiv" class="hidden">
        <input type="text" id="regName" placeholder="Имя">
        <input type="tel" id="regPhone" placeholder="Телефон">
        <input type="email" id="regEmail" placeholder="Email">
        <input type="password" id="regPass" placeholder="Пароль">
        <div id="regMsg" class="msg hidden"></div>
        <button id="regBtn">Зарегистрироваться</button>
        <button id="toLoginBtn" class="btn2">Уже есть аккаунт?</button>
    </div>
</div>

<div id="chatScreen" class="hidden">
    <div class="chat-layout">
        <div class="sidebar">
            <div class="profile">
                <div class="profile-name" id="userName"></div>
                <div style="font-size: 11px; margin-top: 5px;" id="userPhone"></div>
            </div>
            <div class="chat-list" id="chatList"></div>
            <button id="newChannel">📢 Новый канал</button>
            <button id="exitBtn" class="btn-red">Выйти</button>
        </div>
        <div class="main-chat">
            <div class="chat-header" id="chatTitle">Выберите чат</div>
            <div class="messages" id="messagesList"></div>
            <div class="input-area">
                <input type="text" id="msgInput" placeholder="Сообщение...">
                <button id="sendBtn">Отправить</button>
            </div>
        </div>
    </div>
</div>

<script>
    let currentUser = null;
    let allChats = [];
    let activeChat = null;

    function save() {
        if(currentUser) {
            localStorage.setItem('am_' + currentUser.id, JSON.stringify({
                user: currentUser,
                chats: allChats
            }));
        }
    }

    // Регистрация
    function register(name, phone, email, pass) {
        if(!name || !phone || !email || !pass) return 'Заполните все поля!';
        for(let i = 0; i < localStorage.length; i++) {
            let key = localStorage.key(i);
            if(key && key.startsWith('am_')) {
                let data = JSON.parse(localStorage.getItem(key));
                if(data.user.phone === phone) return 'Телефон уже занят!';
                if(data.user.email === email) return 'Email уже занят!';
            }
        }
        let id = Date.now() + '_' + Math.random();
        currentUser = { id: id, name: name, phone: phone, email: email, password: pass };
        allChats = [{
            id: 'main',
            name: '🌈 Главный чат',
            messages: [{ text: 'Добро пожаловать, ' + name + '!', sender: 'system', time: new Date().toLocaleTimeString() }]
        }];
        save();
        return 'ok';
    }

    // Вход
    function login(id, pass) {
        for(let i = 0; i < localStorage.length; i++) {
            let key = localStorage.key(i);
            if(key && key.startsWith('am_')) {
                let data = JSON.parse(localStorage.getItem(key));
                let u = data.user;
                if((u.phone === id || u.email === id || u.name === id) && u.password === pass) {
                    currentUser = u;
                    allChats = data.chats || [];
                    save();
                    return true;
                }
            }
        }
        return false;
    }

    function addMessage(chatId, text) {
        let chat = allChats.find(c => c.id === chatId);
        if(chat) {
            chat.messages.push({ text: text, sender: currentUser.name, time: new Date().toLocaleTimeString() });
            save();
            if(activeChat === chatId) showMessages(chat);
            showChatList();
        }
    }

    function showMessages(chat) {
        let container = document.getElementById('messagesList');
        if(!chat.messages || chat.messages.length === 0) {
            container.innerHTML = '<div style="color:#aaa; text-align:center;">Нет сообщений</div>';
            return;
        }
        container.innerHTML = '';
        for(let i = 0; i < chat.messages.length; i++) {
            let msg = chat.messages[i];
            let isMine = (msg.sender === currentUser.name);
            let div = document.createElement('div');
            div.className = isMine ? 'message-mine' : 'message-other';
            div.innerHTML = '<div class="bubble"><b>' + (msg.sender !== 'system' ? msg.sender : '📢') + '</b><br>' + msg.text + '<div class="time">' + msg.time + '</div></div>';
            container.appendChild(div);
        }
        container.scrollTop = container.scrollHeight;
    }

    function showChatList() {
        let container = document.getElementById('chatList');
        if(!allChats.length) {
            container.innerHTML = '<div style="color:#aaa;">Нет чатов</div>';
            return;
        }
        container.innerHTML = '';
        for(let i = 0; i < allChats.length; i++) {
            let chat = allChats[i];
            let div = document.createElement('div');
            div.className = 'chat-item';
            if(activeChat === chat.id) div.classList.add('active');
            div.innerHTML = '<b>' + chat.name + '</b><br><span style="font-size:10px;">🔒 Защищён</span>';
            div.onclick = (function(c) { return function() {
                activeChat = c.id;
                document.getElementById('chatTitle').innerHTML = c.name;
                showMessages(c);
                showChatList();
            }; })(chat);
            container.appendChild(div);
        }
    }

    function newChannel() {
        let name = prompt('Название канала:');
        if(name && name.trim()) {
            allChats.push({
                id: 'ch_' + Date.now(),
                name: name,
                messages: [{ text: 'Канал "' + name + '" создан!', sender: 'system', time: new Date().toLocaleTimeString() }]
            });
            save();
            showChatList();
        }
    }

    function showChatUI() {
        document.getElementById('authScreen').classList.add('hidden');
        document.getElementById('chatScreen').classList.remove('hidden');
        document.getElementById('userName').innerHTML = currentUser.name;
        document.getElementById('userPhone').innerHTML = '📞 ' + currentUser.phone;
        showChatList();
        if(allChats.length) {
            activeChat = allChats[0].id;
            document.getElementById('chatTitle').innerHTML = allChats[0].name;
            showMessages(allChats[0]);
        }
    }

    // Кнопки
    document.getElementById('loginBtn').onclick = function() {
        let id = document.getElementById('loginId').value.trim();
        let pass = document.getElementById('loginPass').value.trim();
        let msgDiv = document.getElementById('loginMsg');
        if(!id || !pass) {
            msgDiv.classList.remove('hidden');
            msgDiv.className = 'msg error';
            msgDiv.innerText = 'Заполните поля!';
            return;
        }
        if(login(id, pass)) {
            showChatUI();
        } else {
            msgDiv.classList.remove('hidden');
            msgDiv.className = 'msg error';
            msgDiv.innerText = 'Неверные данные!';
        }
    };

    document.getElementById('regBtn').onclick = function() {
        let name = document.getElementById('regName').value.trim();
        let phone = document.getElementById('regPhone').value.trim();
        let email = document.getElementById('regEmail').value.trim();
        let pass = document.getElementById('regPass').value.trim();
        let msgDiv = document.getElementById('regMsg');
        let res = register(name, phone, email, pass);
        if(res === 'ok') {
            msgDiv.classList.remove('hidden');
            msgDiv.className = 'msg success';
            msgDiv.innerText = '✅ Аккаунт создан!';
            setTimeout(function() { showChatUI(); }, 1500);
        } else {
            msgDiv.classList.remove('hidden');
            msgDiv.className = 'msg error';
            msgDiv.innerText = res;
        }
    };

    document.getElementById('toRegBtn').onclick = function() {
        document.getElementById('loginDiv').classList.add('hidden');
        document.getElementById('regDiv').classList.remove('hidden');
    };

    document.getElementById('toLoginBtn').onclick = function() {
        document.getElementById('regDiv').classList.add('hidden');
        document.getElementById('loginDiv').classList.remove('hidden');
    };

    document.getElementById('sendBtn').onclick = function() {
        let input = document.getElementById('msgInput');
        if(activeChat && input.value.trim()) {
            addMessage(activeChat, input.value.trim());
            input.value = '';
        }
    };

    document.getElementById('msgInput').addEventListener('keypress', function(e) {
        if(e.key === 'Enter') document.getElementById('sendBtn').click();
    });

    document.getElementById('newChannel').onclick = newChannel;

    document.getElementById('exitBtn').onclick = function() {
        currentUser = null;
        document.getElementById('chatScreen').classList.add('hidden');
        document.getElementById('authScreen').classList.remove('hidden');
        document.getElementById('loginDiv').classList.remove('hidden');
        document.getElementById('regDiv').classList.add('hidden');
        document.getElementById('loginId').value = '';
        document.getElementById('loginPass').value = '';
        document.getElementById('regName').value = '';
        document.getElementById('regPhone').value = '';
        document.getElementById('regEmail').value = '';
        document.getElementById('regPass').value = '';
    };
</script>
</body>
</html>
