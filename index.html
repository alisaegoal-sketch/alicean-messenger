<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Alicean</title>
    <style>
        body {
            background: linear-gradient(135deg, #1a0b2e, #0a0515);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .box {
            background: #2a1a3e;
            border-radius: 30px;
            padding: 40px;
            text-align: center;
            border: 2px solid #ff77aa;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            color: white;
            margin-bottom: 10px;
        }
        p {
            color: #b0a0d0;
            margin-bottom: 20px;
        }
        button {
            background: linear-gradient(90deg, #ff6a8a, #c55cff);
            border: none;
            padding: 12px 30px;
            border-radius: 30px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        .error {
            color: #ff8888;
            margin-top: 15px;
        }
    </style>
</head>
<body>
<div class="box">
    <h1>🌈 Alicean</h1>
    <p>🔒 Мессенджер загружен</p>
    <button onclick="alert('Регистрация будет работать после исправления кода на GitHub')">Проверить</button>
    <div class="error" id="info"></div>
</div>

<script>
    document.getElementById('info').innerHTML = '✅ Код работает! Чат появится после полной настройки.';
    console.log('Страница загружена, ошибок нет');
</script>
</body>
</html>
